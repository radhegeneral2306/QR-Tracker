<style>
/* =========================================================
   TOKENS
   Radius scale: 12px controls, 18px cards/sheets, 999px pills.
   z-index scale: 20 header/tabs, 25 action bar, 50 sheet,
   60 confirm, 65 success, 70 toast.
   ========================================================= */
:root {
  --bg:         #f3f5f1;
  --surface:    #fdfdfb;
  --surface-2:  #f7f8f5;
  --sunken:     #eceee8;
  --ink:        #17201a;
  --ink-2:      #2f3a33;
  --muted:      #5b665e;
  --muted-2:    #87918a;
  --line:       #e2e6df;
  --line-2:     #cfd5cc;
  --track:      #e4e8e1;

  --brand:      #14532d;
  --brand-2:    #1a6b3a;
  --brand-on:   #f2f7f3;
  --brand-soft: #e2f0e5;
  --brand-text: #14532d;
  --ring:       rgb(26 107 58 / .28);
  --hero-1:     #14532d;
  --hero-2:     #0f4224;

  --ok:         #2f7d32;
  --ok-soft:    #e3f3e4;
  --warn:       #9a610a;
  --warn-soft:  #fbefd0;
  --warn-line:  #efd796;
  --bar-yellow: #dca325;
  --bad:        #c0392b;
  --bad-soft:   #fbe3df;
  --bad-line:   #f2bfb7;
  --info:       #2c5cad;
  --info-soft:  #e5edfa;
  --info-line:  #c8d7f1;

  --r-ctl: 12px;
  --r-card: 18px;
  --shadow-1: 0 1px 2px rgb(20 40 25 / .05), 0 6px 20px rgb(20 40 25 / .05);
  --shadow-2: 0 2px 6px rgb(20 40 25 / .08), 0 18px 48px rgb(20 40 25 / .14);
  --scrim: rgb(14 22 17 / .42);

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  --ease-in: cubic-bezier(0.5, 0, 0.75, 0);
  --t-fast: 140ms;
  --t-med: 280ms;
  --t-slow: 520ms;

  --font: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:         #0e1411;
    --surface:    #151d18;
    --surface-2:  #19221c;
    --sunken:     #1f2a23;
    --ink:        #e8eee9;
    --ink-2:      #c9d3cb;
    --muted:      #98a49b;
    --muted-2:    #6f7b72;
    --line:       #26322a;
    --line-2:     #34423a;
    --track:      #2b3830;

    --brand:      #1f7a45;
    --brand-2:    #23874d;
    --brand-on:   #f2f7f3;
    --brand-soft: #173323;
    --brand-text: #7fd8a4;
    --ring:       rgb(127 216 164 / .28);
    --hero-1:     #154a2b;
    --hero-2:     #0f3520;

    --ok:         #6cc777;
    --ok-soft:    #17301c;
    --warn:       #e7b54a;
    --warn-soft:  #33290f;
    --warn-line:  #5a4614;
    --bar-yellow: #e2ad35;
    --bad:        #f08a7d;
    --bad-soft:   #3a1a17;
    --bad-line:   #5e2a24;
    --info:       #9dbcf3;
    --info-soft:  #172438;
    --info-line:  #263a5a;

    --shadow-1: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .2);
    --shadow-2: 0 2px 6px rgb(0 0 0 / .4), 0 18px 48px rgb(0 0 0 / .45);
    --scrim: rgb(0 0 0 / .55);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
.ph, .ph-fill { line-height: 1; }

/* =========================================================
   MOTION
   ========================================================= */
@keyframes fadeUp   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn   { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut  { from { opacity: 1; } to { opacity: 0; } }
@keyframes sheetIn  { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheetOut { from { transform: none; } to { transform: translateY(100%); } }
@keyframes popIn    { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
@keyframes popOut   { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.96); } }
@keyframes toastIn  { from { opacity: 0; transform: translate(-50%, 16px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes toastOut { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, 10px) scale(.98); } }
@keyframes barIn    { from { transform: scaleX(0); } }
@keyframes shimmer  { from { background-position: 150% 0; } to { background-position: -50% 0; } }
@keyframes checkPop { 0% { opacity: 0; transform: scale(.4) rotate(-12deg); } 60% { opacity: 1; transform: scale(1.08) rotate(0); } 100% { transform: scale(1); } }
@keyframes ring     { from { opacity: .5; transform: scale(.7); } to { opacity: 0; transform: scale(1.6); } }
@keyframes spin     { to { transform: rotate(360deg); } }

/* backwards fill (not both): once done, no transform stays on the element,
   so it never becomes the containing block for position:fixed overlays. */
.enter { animation: fadeUp var(--t-slow) var(--ease-out) backwards; }
.stagger > * { animation: fadeUp var(--t-slow) var(--ease-out) backwards; animation-delay: calc(min(var(--i, 0), 10) * 35ms); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-delay: 0ms !important;
    transition-duration: 1ms !important;
  }
}

/* =========================================================
   SHELL
   ========================================================= */
.app { max-width: 600px; margin: 0 auto; min-height: 100dvh; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
.app.in-flow { padding-bottom: calc(104px + env(safe-area-inset-bottom)); }

.top {
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(180deg, var(--hero-1), var(--hero-2));
  color: var(--brand-on);
  padding: calc(10px + env(safe-area-inset-top)) 16px 12px;
  display: flex; align-items: center; gap: 12px;
}
.top .logo-sm { width: 34px; height: 34px; border-radius: 10px; flex: none; box-shadow: 0 0 0 1px rgb(255 255 255 / .18); }
.top .title { font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
.top .sub { font-size: 12.5px; opacity: .78; }
.top .spacer { flex: 1; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 999px; border: 0; flex: none;
  display: inline-flex; align-items: center; justify-content: center; font-size: 20px;
  background: transparent; color: inherit;
  transition: background var(--t-fast) var(--ease-out), transform var(--t-fast) var(--ease-out);
}
.icon-btn:active { transform: scale(.92); }
.top .icon-btn { background: rgb(255 255 255 / .12); }
.top .icon-btn:hover { background: rgb(255 255 255 / .2); }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  transition: transform var(--t-med) var(--ease-out);
}
.tabs.hidden { transform: translateY(110%); }
.tabs-inner { position: relative; display: flex; max-width: 600px; margin: 0 auto; padding: 6px 8px; }
.tab-ind {
  position: absolute; top: 6px; bottom: 6px; left: 8px;
  width: calc((100% - 16px) / var(--n)); transform: translateX(calc(100% * var(--at)));
  transition: transform 420ms var(--ease-out);
  pointer-events: none;
}
.tab-ind::before { content: ""; position: absolute; inset: 0 10px; border-radius: 14px; background: var(--brand-soft); }
.tab {
  position: relative; flex: 1; border: 0; background: none; padding: 8px 4px 7px;
  font-size: 11.5px; font-weight: 500; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: color var(--t-med) var(--ease-out);
}
.tab i { font-size: 23px; transition: transform var(--t-med) var(--ease-spring); }
.tab.on { color: var(--brand-text); font-weight: 600; }
.tab.on i { transform: translateY(-1px) scale(1.06); }
.tab:active i { transform: scale(.9); }

.page { padding: 16px 16px 24px; }
.h1 { font-size: 22px; font-weight: 650; letter-spacing: -.02em; margin: 2px 0 14px; line-height: 1.2; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; box-shadow: var(--shadow-1); margin-bottom: 12px; }
.card.flat { box-shadow: none; }
.card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
.section-title { font-size: 13px; font-weight: 600; color: var(--muted); margin: 22px 2px 10px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.tiny { font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.right { text-align: right; }
.center { text-align: center; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* =========================================================
   CONTROLS
   ========================================================= */
.field { display: block; margin-bottom: 14px; }
.field > .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.input, select.input, textarea.input {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  padding: 12px 13px; font-size: 16px; outline: none; color: var(--ink);
  transition: border-color var(--t-fast) var(--ease-out), box-shadow var(--t-fast) var(--ease-out), background var(--t-fast);
}
.input::placeholder { color: var(--muted-2); }
.input:focus { border-color: var(--brand-2); background: var(--surface); box-shadow: 0 0 0 4px var(--ring); }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.prefix-field { position: relative; }
.prefix-field > span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }
.prefix-field > .input { padding-left: 32px; }

.amount-field {
  display: flex; align-items: baseline; gap: 6px; padding: 16px 18px;
  background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-card);
  transition: border-color var(--t-fast) var(--ease-out), box-shadow var(--t-fast) var(--ease-out);
}
.amount-field:focus-within { border-color: var(--brand-2); box-shadow: 0 0 0 4px var(--ring); background: var(--surface); }
.amount-field > span { font-size: 30px; font-weight: 600; color: var(--muted); }
.amount-field input {
  flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
  font-size: 40px; font-weight: 650; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums;
}
.amount-field input::placeholder { color: var(--line-2); }
.amount-words { min-height: 20px; margin: 8px 4px 16px; font-size: 13.5px; color: var(--muted); transition: opacity var(--t-med); }

.btn {
  border: 0; border-radius: var(--r-ctl); padding: 13px 16px; font-size: 15px; font-weight: 600;
  background: var(--brand); color: var(--brand-on); white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform var(--t-fast) var(--ease-out), background var(--t-fast), opacity var(--t-med), box-shadow var(--t-fast);
}
.btn i { font-size: 18px; }
.btn:hover { background: var(--brand-2); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible, .tile:focus-visible, .seg button:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--ring); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.block { width: 100%; }
.btn.big { padding: 16px; font-size: 16.5px; border-radius: 14px; }
.btn.ok { background: var(--ok); color: #fbfdfb; }
.btn.ok:hover { filter: brightness(1.05); }
.btn.bad { background: var(--bad); color: #fffaf9; }
.btn.bad:hover { filter: brightness(1.05); }
@media (prefers-color-scheme: dark) {
  .btn.ok { background: #2e8a3c; }
  .btn.bad { background: #b9372a; }
}
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.soft { background: var(--brand-soft); color: var(--brand-text); }
.btn.soft:hover { filter: brightness(.98); }
.btn.sm { padding: 8px 12px; font-size: 13.5px; border-radius: 10px; gap: 6px; }
.btn.sm i { font-size: 16px; }
.btn-row { display: flex; gap: 10px; }
.btn-row > * { flex: 1; }
.spin { display: inline-block; animation: spin .8s linear infinite; }

/* segmented control */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunken); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
.seg .seg-ind {
  position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / var(--n));
  transform: translateX(calc(100% * var(--at))); background: var(--surface); border-radius: 9px; box-shadow: var(--shadow-1);
  transition: transform 380ms var(--ease-out);
}
.seg button { position: relative; border: 0; background: none; padding: 9px 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: color var(--t-med); }
.seg button.on { color: var(--ink); }

/* toggle */
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.toggle:last-child { border-bottom: 0; }
.toggle .t-label { font-weight: 550; }
.toggle .t-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch .sl { position: absolute; inset: 0; background: var(--line-2); border-radius: 99px; transition: background var(--t-med) var(--ease-out); cursor: pointer; }
.switch .sl::after {
  content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fdfdfb; border-radius: 50%;
  box-shadow: 0 1px 3px rgb(0 0 0 / .22); transition: transform 360ms var(--ease-spring);
}
.switch input:checked + .sl { background: var(--ok); }
.switch input:checked + .sl::after { transform: translateX(20px); }
.switch input:focus-visible + .sl { box-shadow: 0 0 0 4px var(--ring); }
.switch input:disabled + .sl { opacity: .5; }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.badge i { font-size: 12px; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.info { background: var(--info-soft); color: var(--info); }

/* usage bar */
.bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; }
.bar > div {
  height: 100%; width: 100%; background: var(--ok); border-radius: 99px; transform-origin: left center;
  transform: scaleX(var(--p)); animation: barIn 900ms var(--ease-out) both;
  transition: transform 700ms var(--ease-out), background var(--t-med);
}
.bar.yellow > div { background: var(--bar-yellow); }
.bar.red > div { background: var(--bad); }

.alert { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; border: 1px solid transparent; animation: fadeUp var(--t-med) var(--ease-out) both; }
.alert > i { font-size: 19px; flex: none; margin-top: 1px; }
.alert.yellow { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
.alert.red { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-line); }
.alert.info { background: var(--info-soft); color: var(--info); border-color: var(--info-line); }

/* steps */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
.steps > div { font-size: 11.5px; font-weight: 600; color: var(--muted-2); }
.steps > div::before { content: ""; display: block; height: 4px; border-radius: 99px; background: var(--line-2); margin-bottom: 6px; transition: background var(--t-slow) var(--ease-out); }
.steps > div.done { color: var(--brand-text); }
.steps > div.done::before { background: var(--brand-2); }

/* QR display */
.qr-wrap { background: #fdfdfb; border-radius: var(--r-card); padding: 14px; display: flex; justify-content: center; align-items: center; min-height: 240px; animation: popIn var(--t-slow) var(--ease-out) both; }
.qr-wrap svg, .qr-wrap img { width: 100%; max-width: 290px; height: auto; display: block; }
.pay-amount { font-size: 38px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.remark-chip { display: inline-flex; align-items: center; font-family: var(--mono); font-size: 13px; background: var(--brand-soft); color: var(--brand-text); padding: 4px 10px; border-radius: 8px; font-weight: 600; white-space: nowrap; }

/* sticky bottom action bar for the payment flow */
.action-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: color-mix(in srgb, var(--surface) 90%, transparent);

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* =========================================================
   FIREBASE SETUP - paste your own project's config here
   (Firebase console -> Project settings -> Your apps -> Web app)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBPRkpxEosqNqhf2JDsidU6UBKie6odv7A",
  authDomain: "new-project-acec2.firebaseapp.com",
  projectId: "new-project-acec2",
  storageBucket: "new-project-acec2.firebasestorage.app",
  messagingSenderId: "586352050626",
  appId: "1:586352050626:web:18dff1753657f7ee81d65b",
};

/* =========================================================
   LOGINS - one Firebase Auth user per branch + one owner.
   Create these exact emails in Firebase console -> Authentication.
   ADMIN_EMAIL must also match the one in firestore.rules.
   remarkName goes into the UPI remark, keep it short.
   ========================================================= */
const ADMIN_EMAIL = "admin@qrtracker.app";
const BRANCHES = [
  { id: "raipur",    name: "Raipur",       remarkName: "Raipur", email: "raipur@qrtracker.app" },
  { id: "durg",      name: "Durg",         remarkName: "Durg",   email: "durg@qrtracker.app" },
  { id: "jagdalpur", name: "Jagdalpur",    remarkName: "Jdp",    email: "jagdalpur@qrtracker.app" },
  { id: "hardware",  name: "Hardware Drg", remarkName: "HwDrg",  email: "hardware@qrtracker.app" },
];

// A generated-but-not-yet-received payment keeps its amount "reserved"
// on that QR for this long, so two branches can't both fill the same
// QR at once. After this it stops counting (staff forgot to press a
// button), but the entry stays in the open-payments list.
const HOLD_MINUTES = 30;
const EDIT_WINDOW_HOURS = 24;
const DEFAULT_SETTINGS = { margin: 10000, photoRequiredAll: false };

const HOLD_MS = HOLD_MINUTES * 60 * 1000;
const EDIT_WINDOW_MS = EDIT_WINDOW_HOURS * 60 * 60 * 1000;
const CONFIG_MISSING = !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("PASTE");

let db = null, auth = null;
if (!CONFIG_MISSING) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  // Local testing against the Firebase emulator: open with ?emulator on localhost.
  if (["localhost", "127.0.0.1"].includes(location.hostname) && new URLSearchParams(location.search).has("emulator")) {
    db.useEmulator("127.0.0.1", 8080);
    auth.useEmulator("http://127.0.0.1:9099", { disableWarnings: true });
  }
}
const FV = firebase.firestore.FieldValue;

/* =========================================================
   HELPERS
   ========================================================= */
// Always India Standard Time, whatever the phone's own timezone is.
const IST_OFFSET_MS = 5.5 * 60 * 60 * 1000;
const pad2 = (n) => String(n).padStart(2, "0");
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONTHS_FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

function istDate(ms = Date.now()) { return new Date(ms + IST_OFFSET_MS); }
function monthKey(ms = Date.now()) { const d = istDate(ms); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}`; }
function dayKey(ms = Date.now()) { const d = istDate(ms); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; }
function monthLabel(mk) { const [y, m] = mk.split("-").map(Number); return `${MONTHS_FULL[m - 1]} ${y}`; }
function fmtDateTime(ms) {
  if (!ms) return "";
  const d = istDate(ms);
  let h = d.getUTCHours(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}, ${h}:${pad2(d.getUTCMinutes())} ${ap}`;
}
function fmtDate(dk) { if (!dk) return ""; const [y, m, d] = dk.split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; }
function rupees(n) { return "₹" + (Number(n) || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 }); }
function parseAmount(s) {
  const n = Number(String(s ?? "").replace(/[,\s₹]/g, ""));
  if (!isFinite(n)) return NaN;
  return Math.round(n * 100) / 100;
}
function tsMs(v) { return v && typeof v.toMillis === "function" ? v.toMillis() : (typeof v === "number" ? v : 0); }

function roleFor(user) {
  if (!user) return null;
  const email = (user.email || "").toLowerCase();
  if (email === ADMIN_EMAIL) return { isAdmin: true, id: "admin", name: "Owner", remarkName: "Admin", email };
  const b = BRANCHES.find((x) => x.email === email);
  if (!b) return { unknown: true, email };
  return { isAdmin: false, ...b, remarkName: b.remarkName || b.name };
}
function branchName(email) {
  if (email === ADMIN_EMAIL) return "Owner";
  const b = BRANCHES.find((x) => x.email === email);
  return b ? b.name : email;
}

/* ---- QR limits ---- */
function isExpired(qr, today = dayKey()) { return !!(qr.expiryEnabled && qr.expiryDate && today > qr.expiryDate); }
function pruneHolds(holds, now) {
  const out = {};
  for (const [k, h] of Object.entries(holds || {})) if (h && h.at > now - HOLD_MS) out[k] = h;
  return out;
}
function usageFor(total, now = Date.now()) {
  const received = Number(total && total.received) || 0;
  let held = 0;
  for (const h of Object.values(pruneHolds(total && total.holds, now))) held += Number(h.amount) || 0;
  return { received, held, used: received + held };
}
// Enabled, not expired, highest limit first (older QR first on a tie).
function activeQrs(qrs, today = dayKey()) {
  return (qrs || [])
    .filter((q) => q.enabled && !q.archived && !isExpired(q, today) && q.upiId && Number(q.limit) > 0)
    .sort((a, b) => b.limit - a.limit || (a.createdAtMs || 0) - (b.createdAtMs || 0));
}
// Margin rule: a QR that is still under its limit can take one more payment
// that pushes it over, as long as it stays within limit + margin.
// Once it is at/over 100% it is skipped.
function qrFits(used, limit, amount, margin) { return used < limit && used + amount <= limit + margin; }
function levelFor(used, limit) {
  if (!limit) return "ok";
  const p = used / limit;
  return p >= 1 ? "red" : p >= 0.9 ? "yellow" : "ok";
}
function pct(used, limit) { return limit ? Math.round((used / limit) * 100) : 0; }

/* ---- UPI ---- */
function parseUpi(text) {
  if (!text) return null;
  const t = text.trim();
  if (!/^upi:\/\/pay/i.test(t)) return null;
  const qi = t.indexOf("?");
  if (qi < 0) return null;
  const p = new URLSearchParams(t.slice(qi + 1));
  const pa = (p.get("pa") || "").trim();
  if (!pa) return null;
  return { pa, pn: (p.get("pn") || "").trim() };
}
function upiLink({ upiId, payee, amount, remark }) {
  // UPI ids are plain [a-z0-9.-_@], left as-is: some apps choke on %40.
  const parts = [`pa=${upiId}`];
  if (payee) parts.push(`pn=${encodeURIComponent(payee)}`);
  parts.push(`am=${Number(amount).toFixed(2)}`, "cu=INR");
  if (remark) parts.push(`tn=${encodeURIComponent(remark)}`);
  return "upi://pay?" + parts.join("&");
}
function qrSvg(text) {
  const q = qrcode(0, "M");
  q.addData(text);
  q.make();
  return q.createSvgTag({ cellSize: 6, margin: 3, scalable: true });
}

/* ---- images ---- */
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, revoke: () => URL.revokeObjectURL(url) });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Photo open nahi hui. JPG/PNG try karein.")); };
    img.src = url;
  });
}
function drawScaled(img, maxDim) {
  const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.naturalWidth * scale));
  c.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return { c, ctx };
}
// Photos are stored inside Firestore (works on the free plan), so they must
// stay well under Firestore's 1 MB document limit. Target ~200 KB.
async function compressImage(file, { maxDim = 1100, maxChars = 270000, quality = 0.7 } = {}) {
  const { img, revoke } = await loadImage(file);
  try {
    let dim = maxDim, q = quality;
    for (let i = 0; i < 10; i++) {
      const { c } = drawScaled(img, dim);
      const url = c.toDataURL("image/jpeg", q);
      if (url.length <= maxChars) return url;
      if (q > 0.45) q -= 0.1; else dim = Math.round(dim * 0.8);
    }
    throw new Error("Photo bahut badi hai, dusri photo try karein.");
  } finally { revoke(); }
}
async function decodeQrFromFile(file) {
  const { img, revoke } = await loadImage(file);
  try {
    if ("BarcodeDetector" in window) {
      try {
        const det = new window.BarcodeDetector({ formats: ["qr_code"] });
        const found = await det.detect(img);
        if (found && found[0] && found[0].rawValue) return found[0].rawValue;
      } catch (e) { /* fall through to jsQR */ }
    }
    for (const dim of [1000, 700, 1500, 450]) {
      const { c, ctx } = drawScaled(img, dim);
      const data = ctx.getImageData(0, 0, c.width, c.height);
      const r = jsQR(data.data, c.width, c.height, { inversionAttempts: "attemptBoth" });
      if (r && r.data) return r.data;
    }
    return null;
  } finally { revoke(); }
}

function errMsg(e) {
  const code = (e && (e.code || e.message)) || "";
  if (code === "NO_QR") return "Koi bhi QR is amount ke liye available nahi hai. Owner se baat karein.";
  if (code === "ALREADY_DONE") return "Yeh payment pehle hi update ho chuki hai.";
  if (code === "NOT_FOUND") return "Entry nahi mili.";
  if (code === "permission-denied" || /permission/i.test(code)) return "Permission nahi hai (24 ghante ka lock, ya login issue).";
  if (code === "unavailable" || /offline|network/i.test(code)) return "Internet nahi hai. Connection check karke dobara try karein.";
  if (/auth\/(invalid-credential|wrong-password|user-not-found|invalid-login-credentials)/.test(code)) return "Password galat hai.";
  if (/auth\/too-many-requests/.test(code)) return "Bahut baar galat try hua. Thodi der baad try karein.";
  if (/auth\/network/.test(code)) return "Internet nahi hai.";
  return (e && e.message) || "Kuch gadbad ho gayi. Dobara try karein.";
}

/* =========================================================
   DATA WRITES (all limit-affecting writes are transactions)
   ========================================================= */
const totalRef = (month, qrId) => db.doc(`totals/${month}_${qrId}`);

// Pick the first QR (highest limit first) that can take this amount, put a
// hold on it and create a pending entry with the next remark number.
async function reservePayment({ role, qrs, margin, amount }) {
  const month = monthKey();
  const cands = activeQrs(qrs);
  if (!cands.length) throw new Error("NO_QR");
  return db.runTransaction(async (tx) => {
    const counterRef = db.doc(`counters/${month}_${role.id}`);
    const cSnap = await tx.get(counterRef);
    const tSnaps = [];
    for (const q of cands) tSnaps.push(await tx.get(totalRef(month, q.id)));
    const now = Date.now();
    let idx = -1;
    for (let i = 0; i < cands.length; i++) {
      const u = usageFor(tSnaps[i].data(), now);
      if (qrFits(u.used, Number(cands[i].limit), amount, margin)) { idx = i; break; }
    }
    if (idx < 0) throw new Error("NO_QR");
    const qr = cands[idx];
    const n = ((cSnap.exists && cSnap.data().n) || 0) + 1;
    const remark = `${role.remarkName} ${String(n).padStart(4, "0")}`;
    const entryRef = db.collection("entries").doc();
    const t = tSnaps[idx].data() || {};
    const holds = pruneHolds(t.holds, now);
    holds[entryRef.id] = { amount, at: now };
    tx.set(totalRef(month, qr.id), { month, qrId: qr.id, received: Number(t.received) || 0, holds });
    tx.set(counterRef, { n });
    const entry = {
      type: "payment", status: "pending",
      qrId: qr.id, qrName: qr.name, upiId: qr.upiId, payeeName: qr.payeeName || "",
      amount, reservedAmount: amount, remark, seq: n, month,
      branch: role.email, branchId: role.id, branchName: role.name,
      createdAt: FV.serverTimestamp(), createdAtMs: now, hasPhoto: false,
    };
    tx.set(entryRef, entry);
    return { id: entryRef.id, ...entry, createdAt: null };
  });
}

async function savePhoto(entry, dataUrl) {
  await db.doc(`photos/${entry.id}`).set({ branch: entry.branch, data: dataUrl, at: FV.serverTimestamp() });
}

async function markReceived(entry, { amount, photo }) {
  if (photo) await savePhoto(entry, photo);
  await db.runTransaction(async (tx) => {
    const eRef = db.doc(`entries/${entry.id}`);
    const tRef = totalRef(entry.month, entry.qrId);
    const eSnap = await tx.get(eRef);
    const tSnap = await tx.get(tRef);
    if (!eSnap.exists) throw new Error("NOT_FOUND");
    const e = eSnap.data();
    if (e.status !== "pending") throw new Error("ALREADY_DONE");
    const t = tSnap.data() || {};
    const holds = pruneHolds(t.holds, Date.now());
    delete holds[entry.id];
    tx.set(tRef, { month: entry.month, qrId: entry.qrId, received: (Number(t.received) || 0) + amount, holds });
    tx.update(eRef, { status: "received", amount, receivedAt: FV.serverTimestamp(), receivedAtMs: Date.now(), hasPhoto: !!(e.hasPhoto || photo) });
  });
}

async function cancelPayment(entry) {
  await db.runTransaction(async (tx) => {
    const eRef = db.doc(`entries/${entry.id}`);
    const tRef = totalRef(entry.month, entry.qrId);
    const eSnap = await tx.get(eRef);
    const tSnap = await tx.get(tRef);
    if (!eSnap.exists) throw new Error("NOT_FOUND");
    if (eSnap.data().status !== "pending") throw new Error("ALREADY_DONE");
    const t = tSnap.data() || {};
    const holds = pruneHolds(t.holds, Date.now());
    delete holds[entry.id];
    tx.set(tRef, { month: entry.month, qrId: entry.qrId, received: Number(t.received) || 0, holds });
    tx.update(eRef, { status: "cancelled", cancelledAtMs: Date.now() });
  });
}

// Edit amount / add photo / delete on a received entry or adjustment.
// Delete is soft (status "deleted") so history is never lost.
async function editEntry(entry, { amount, photo, note, del }, role) {
  if (photo) await savePhoto(entry, photo);
  await db.runTransaction(async (tx) => {
    const eRef = db.doc(`entries/${entry.id}`);
    const tRef = totalRef(entry.month, entry.qrId);
    const eSnap = await tx.get(eRef);
    const tSnap = await tx.get(tRef);
    if (!eSnap.exists) throw new Error("NOT_FOUND");
    const e = eSnap.data();
    if (e.status !== "received") throw new Error("ALREADY_DONE");
    const newAmount = del ? 0 : (amount ?? e.amount);
    const t = tSnap.data() || {};
    tx.set(tRef, { month: entry.month, qrId: entry.qrId, received: (Number(t.received) || 0) + newAmount - e.amount, holds: pruneHolds(t.holds, Date.now()) });
    const upd = { editedAtMs: Date.now(), editedBy: role.name, hasPhoto: !!(e.hasPhoto || photo) };
    if (del) { upd.status = "deleted"; upd.deletedAmount = e.amount; }
    else { upd.amount = newAmount; if (newAmount !== e.amount) upd.originalAmount = e.originalAmount ?? e.amount; }
    if (note !== undefined) upd.note = note;
    tx.update(eRef, upd);
  });
}

// Owner-only manual correction (+ or -) on a QR's month total.
async function addAdjustment({ month, qr, amount, note }) {
  await db.runTransaction(async (tx) => {
    const tRef = totalRef(month, qr.id);
    const tSnap = await tx.get(tRef);
    const t = tSnap.data() || {};
    const now = Date.now();
    tx.set(tRef, { month, qrId: qr.id, received: (Number(t.received) || 0) + amount, holds: pruneHolds(t.holds, now) });
    tx.set(db.collection("entries").doc(), {
      type: "adjustment", status: "received", qrId: qr.id, qrName: qr.name, upiId: qr.upiId,
      amount, remark: "Adjustment", note: note || "", month,
      branch: ADMIN_EMAIL, branchId: "admin", branchName: "Owner",
      createdAt: FV.serverTimestamp(), createdAtMs: now, hasPhoto: false,
    });
  });
}

// Safety net: rebuild every QR's month total from its received entries.
async function recalcTotals(month, qrs) {
  const snap = await db.collection("entries").where("month", "==", month).get();
  const sums = {};
  snap.forEach((d) => { const e = d.data(); if (e.status === "received") sums[e.qrId] = (sums[e.qrId] || 0) + (Number(e.amount) || 0); });
  const ids = new Set([...qrs.map((q) => q.id), ...Object.keys(sums)]);
  const batch = db.batch();
  ids.forEach((id) => batch.set(totalRef(month, id), { month, qrId: id, received: Math.round((sums[id] || 0) * 100) / 100 }, { merge: true }));
  await batch.commit();
}

// Owner bulk delete. Received entries become "deleted" and leave the QR
// total; pending ones are cancelled and their hold released. One
// transaction per QR-month so each total is updated exactly once.
async function bulkDeleteEntries(entries, role) {
  const groups = {};
  entries.filter((e) => e.status === "received" || e.status === "pending").forEach((e) => {
    const k = `${e.month}_${e.qrId}`;
    (groups[k] = groups[k] || []).push(e);
  });
  let done = 0;
  for (const list of Object.values(groups)) {
    for (let i = 0; i < list.length; i += 200) {
      const chunk = list.slice(i, i + 200);
      const { month, qrId } = chunk[0];
      await db.runTransaction(async (tx) => {
        const tRef = totalRef(month, qrId);
        const tSnap = await tx.get(tRef);
        const snaps = [];
        for (const e of chunk) snaps.push(await tx.get(db.doc(`entries/${e.id}`)));
        const t = tSnap.data() || {};
        const now = Date.now();
        const holds = pruneHolds(t.holds, now);
        let received = Number(t.received) || 0;
        snaps.forEach((snap) => {
          if (!snap.exists) return;
          const e = snap.data();
          if (e.status === "received") {
            received -= Number(e.amount) || 0;
            tx.update(snap.ref, { status: "deleted", deletedAmount: e.amount, editedAtMs: now, editedBy: role.name });
          } else if (e.status === "pending") {
            delete holds[snap.id];
            tx.update(snap.ref, { status: "cancelled", cancelledAtMs: now, editedBy: role.name });
          }
        });
        tx.set(tRef, { month, qrId, received: Math.round(received * 100) / 100, holds });
      });
      done += chunk.length;
    }
  }
  return done;
}

// Owner only: wipe already deleted/cancelled entries (and their photos)
// for good. They no longer count in any total, so totals are untouched.
async function purgeEntries(entries) {
  const gone = entries.filter((e) => e.status === "deleted" || e.status === "cancelled");
  for (let i = 0; i < gone.length; i += 200) {
    const batch = db.batch();
    gone.slice(i, i + 200).forEach((e) => {
      batch.delete(db.doc(`entries/${e.id}`));
      batch.delete(db.doc(`photos/${e.id}`));
    });
    await batch.commit();
  }
  return gone.length;
}

function useSnapshot(makeRef, deps) {
  const [state, setState] = useState({ data: null, loading: true, error: null });
  useEffect(() => {
    const ref = makeRef();
    if (!ref) { setState({ data: null, loading: false, error: null }); return; }
    setState((s) => ({ ...s, loading: true }));
    return ref.onSnapshot(
      (snap) => {
        const data = snap.docs ? snap.docs.map((d) => ({ id: d.id, ...d.data() })) : (snap.exists ? { id: snap.id, ...snap.data() } : null);
        setState({ data, loading: false, error: null });
      },
      (err) => { console.error(err); setState({ data: null, loading: false, error: err }); }
    );
  }, deps);
  return state;
}
function useNow(everyMs = 30000) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), everyMs); return () => clearInterval(t); }, [everyMs]);
  return now;
}

const { useLayoutEffect } = React;
const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
const EXIT_MS = REDUCED_MOTION ? 0 : 230;

function Icon({ n, fill, className = "", ...rest }) {
  return <i className={`${fill ? "ph-fill" : "ph"} ph-${n} ${className}`} aria-hidden="true" {...rest} />;
}
// Overlays render straight into <body> so no animated/transformed page
// wrapper can trap their position:fixed layout.
function Overlay({ children }) { return ReactDOM.createPortal(children, document.body); }

function timeAgo(ms, now) {
  const m = Math.max(0, Math.round((now - ms) / 60000));
  if (m < 1) return "abhi";
  if (m < 60) return `${m} min pehle`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h} ghante pehle` : fmtDateTime(ms);
}

// Animated rupee figure. Writes straight to the DOM node on each frame so
// a count-up never re-renders React.
function CountUp({ value, className }) {
  const ref = useRef(null);
  const shown = useRef(0);
  useLayoutEffect(() => {
    const el = ref.current;
    const from = shown.current, to = Number(value) || 0;
    if (REDUCED_MOTION || from === to) { shown.current = to; el.textContent = rupees(to); return; }
    const start = performance.now(), dur = 750;
    let raf;
    const step = (t) => {
      const k = Math.min(1, (t - start) / dur);
      const e = 1 - Math.pow(1 - k, 4);
      const v = from + (to - from) * e;
      shown.current = v;
      el.textContent = rupees(k === 1 ? to : Math.round(v));
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return <span ref={ref} className={className} />;
}

/* ---- confirm dialog (replaces window.confirm) ---- */
const ConfirmCtx = React.createContext(async () => true);
function useConfirm() { return React.useContext(ConfirmCtx); }
function ConfirmHost({ children }) {
  const [state, setState] = useState(null);   // { opts, resolve, closing }
  const ask = useCallback((opts) => new Promise((resolve) => setState({ opts, resolve, closing: false })), []);
  function done(v) {
    if (!state || state.closing) return;
    state.resolve(v);
    setState({ ...state, closing: true });
    setTimeout(() => setState(null), EXIT_MS);
  }
  useEffect(() => {
    if (!state) return;
    const onKey = (e) => { if (e.key === "Escape") done(false); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [state]);
  const o = state && state.opts;
  return (
    <ConfirmCtx.Provider value={ask}>
      {children}
      {state && (
        <div className={"dialog-bg" + (state.closing ? " closing" : "")} onClick={(e) => { if (e.target === e.currentTarget) done(false); }}>
          <div className="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">
            <div className={"d-ic" + (o.danger ? " danger" : "")}><Icon n={o.icon || (o.danger ? "warning" : "question")} /></div>
            <h3 id="dlg-t">{o.title}</h3>
            {o.body && <p>{o.body}</p>}
            <div className="btn-row">
              <button className="btn ghost confirm-cancel" onClick={() => done(false)}>{o.cancelLabel || "Rehne do"}</button>
              <button className={"btn confirm-ok" + (o.danger ? " bad" : "")} autoFocus onClick={() => done(true)}>{o.okLabel || "Haan"}</button>
            </div>
          </div>
        </div>
      )}
    </ConfirmCtx.Provider>
  );
}

  const [closing, setClosing] = useState(false);
  const close = useCallback(() => {
    setClosing((c) => {

      return true;
    });
  }, [onClose]);
  return [closing, close];
}
function Sheet({ title, closing, onClose, children }) {
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => { document.body.style.overflow = prev; window.removeEventListener("keydown", onKey); };
  }, [onClose]);
  return (
    <Overlay>
      <div className={"sheet-bg" + (closing ? " closing" : "")} onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
        <div className="sheet" role="dialog" aria-modal="true" aria-label={title}>

}

/* =========================================================
   RECEIVE FLOW
   ========================================================= */
function ReceiveTab({ role, settings, qrs, totals, now, onFlowChange }) {
  const toast = useToast();
  const ask = useConfirm();
  const [amountStr, setAmountStr] = useState("");
  const [current, setCurrent] = useState(null);   // the pending entry being shown
  const [step, setStep] = useState("amount");     // amount | show | receive
  const [success, setSuccess] = useState(null);   // { amount, remark }
  const [busy, setBusy] = useState(false);

  const pendingS = useSnapshot(() => role.isAdmin
    ? db.collection("entries").where("status", "==", "pending")
    : db.collection("entries").where("branch", "==", role.email).where("status", "==", "pending"), [role.email]);
  const pending = (pendingS.data || []).slice().sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));

  const inFlow = !!((current && step !== "amount") || success);
  useEffect(() => { onFlowChange(inFlow); }, [inFlow]);
  useEffect(() => () => onFlowChange(false), []);
  useEffect(() => { window.scrollTo({ top: 0, behavior: REDUCED_MOTION ? "auto" : "smooth" }); }, [step, !!success]);

  // Leave the screen if another phone finished this payment.
  useEffect(() => {
    if (!current || pendingS.loading || !pendingS.data) return;
    const live = pendingS.data.find((e) => e.id === current.id);
    if (!live && step !== "amount" && !busy) {
      const t = setTimeout(() => {
        db.doc(`entries/${current.id}`).get().then((s) => {
          if (s.exists && s.data().status !== "pending") { setCurrent(null); setStep("amount"); toast("Yeh payment kisi aur ne update kar di."); }
        }).catch(() => {});
      }, 1500);
      return () => clearTimeout(t);
    }
  }, [pendingS.data]);

  const active = activeQrs(qrs);
  const amount = parseAmount(amountStr);

  async function generate() {
    if (!(amount > 0)) { toast("Sahi amount daalein.", true); return; }
    setBusy(true);
    try {
      const entry = await reservePayment({ role, qrs, margin: Number(settings.margin) || 0, amount });
      setCurrent(entry);
      setStep("show");
      setAmountStr("");
    } catch (e) { toast(errMsg(e), true); }
    finally { setBusy(false); }
  }
  async function cancel() {
    const ok = await ask({ title: "Payment cancel karein?", body: `${rupees(current.amount)} (${current.remark}) kuch bhi add nahi hoga.`, okLabel: "Cancel karo", cancelLabel: "Wapas", danger: true });
    if (!ok) return;
    setBusy(true);
    try { await cancelPayment(current); toast("Payment cancel ho gayi."); setCurrent(null); setStep("amount"); }
    catch (e) { toast(errMsg(e), true); }
    finally { setBusy(false); }
  }

  if (success) {
    return <SuccessScreen {...success} onNext={() => setSuccess(null)} />;
  }
  if (current && step === "show") {
    return <ShowQr entry={current} qrs={qrs} totals={totals} now={now} busy={busy}
      onReceived={() => setStep("receive")} onCancel={cancel}
      onBack={() => { setCurrent(null); setStep("amount"); }} />;
  }
  if (current && step === "receive") {
    const qr = (qrs || []).find((q) => q.id === current.qrId);
    const photoRequired = !!(settings.photoRequiredAll || (qr && qr.photoRequired));
    return <ReceiveForm entry={current} photoRequired={photoRequired}
      onBack={() => setStep("show")}
      onDone={(amt) => { setSuccess({ amount: amt, remark: current.remark, qrName: current.qrName }); setCurrent(null); setStep("amount"); }} />;
  }

  return (
    <div className="page enter">
      <h1 className="h1">Kitna amount receive karna hai?</h1>
      <label className="amount-field">
        <span>₹</span>
        <input inputMode="decimal" placeholder="0" value={amountStr} autoFocus aria-label="Amount"
          onChange={(e) => setAmountStr(e.target.value.replace(/[^0-9.,]/g, ""))}
          onKeyDown={(e) => { if (e.key === "Enter") generate(); }} />
      </label>
      <div className="amount-words num" style={{ opacity: amount > 0 ? 1 : 0 }}>{amount > 0 ? rupees(amount) : " "}</div>
      <button className="btn block big" disabled={busy || !(amount > 0) || !active.length} onClick={generate}>
        {busy ? <><Spinner />QR dhundh rahe hain</> : <><Icon n="qr-code" />QR banao</>}
      </button>
      {!active.length && <div style={{ marginTop: 12 }}><Alert kind="red">Abhi koi active QR nahi hai. Owner ko QR add ya enable karna hoga.</Alert></div>}

      {pending.length > 0 && <>
        <div className="section-title">Open payments ({pending.length})</div>
        <div className="card list stagger" style={{ padding: "2px 16px" }}>
          {pending.map((e, i) => {
            const stale = now - (e.createdAtMs || 0) > HOLD_MS;
            return (
              <div className="list-item" key={e.id} style={{ "--i": i }}>
                <div className="grow">
                  <div className="row" style={{ gap: 8 }}><span className="remark-chip">{e.remark}</span><span className="amt">{rupees(e.amount)}</span></div>
                  <div className="meta">
                    <span>{e.qrName}</span>
                    {role.isAdmin && <span className="badge">{e.branchName}</span>}
                    <span style={stale ? { color: "var(--warn)", fontWeight: 600 } : null}><Icon n="clock" /> {timeAgo(e.createdAtMs, now)}</span>
                  </div>
                </div>
                <button className="btn sm soft" onClick={() => { setCurrent(e); setStep("show"); }}>Kholo<Icon n="caret-right" /></button>
              </div>
            );
          })}
        </div>
        {pending.some((e) => now - (e.createdAtMs || 0) > HOLD_MS) && <div className="hint">{HOLD_MINUTES} min se purani payments ko Received ya Cancel kar dein.</div>}
      </>}
    </div>
  );
}

function ShowQr({ entry, qrs, totals, now, busy, onReceived, onCancel, onBack }) {

  useEffect(() => {

        <span className="badge warn"><Icon n="hourglass" />Payment ka wait</span>
      </div>
      <Steps at={2} />

      <div className="card">
        <div className="row" style={{ alignItems: "flex-start", marginBottom: 12 }}>
          <div className="grow">
            <div className="pay-amount">{rupees(entry.amount)}</div>
            <div className="small muted ellipsis" style={{ marginTop: 4 }}>{entry.qrName}</div>
            <div className="tiny muted mono ellipsis">{entry.upiId}</div>

          <div className="right">
            <div className="tiny muted" style={{ marginBottom: 4 }}>Remark</div>
            <span className="remark-chip">{entry.remark}</span>

          ? <div className="qr-wrap" key="upi" dangerouslySetInnerHTML={{ __html: svg }} />

              {orig.loading ? <div className="skel" style={{ width: 240, height: 240 }} /> : orig.error ? <Alert kind="red">{orig.error}</Alert>
                : orig.data ? <img src={orig.data} alt="Original QR" /> : <Empty icon="image-broken" title="Original photo nahi mili" />}
            </div>}
        {mode === "orig" && <div style={{ marginTop: 12 }}><Alert kind="info">Is QR mein customer ko amount khud daalna hoga: <b>{rupees(entry.amount)}</b></Alert></div>}
        {qr && <div style={{ marginTop: 14 }}>

        <button className="btn ghost big" style={{ flex: "0 0 36%" }} disabled={busy} onClick={onCancel}>Cancel</button>
        <button className="btn ok big" disabled={busy} onClick={onReceived}><Icon n="check-circle" />Payment received</button>
      </div></div></Overlay>

function ReceiveForm({ entry, photoRequired, onBack, onDone }) {
  const toast = useToast();
  const ask = useConfirm();
  const [amountStr, setAmountStr] = useState(String(entry.amount));
  const [photo, setPhoto] = useState(null);
  const [busy, setBusy] = useState(false);
  const amount = parseAmount(amountStr);
  const changed = amount > 0 && amount !== entry.amount;
  async function save() {
    if (!(amount > 0)) { toast("Sahi amount daalein.", true); return; }
    if (photoRequired && !photo) { toast("Reference photo zaroori hai.", true); return; }
    if (changed && !(await ask({ title: "Amount badla hai", body: `${rupees(entry.amount)} ki jagah ${rupees(amount)} save karein?`, okLabel: "Haan, save karo" }))) return;
    setBusy(true);
    try { await markReceived(entry, { amount, photo }); onDone(amount); }
    catch (e) { toast(errMsg(e), true); setBusy(false); }
  }
  return (
    <div className="page enter">
      <div className="row" style={{ marginBottom: 12 }}>
        <button className="btn sm ghost" onClick={onBack} disabled={busy}><Icon n="arrow-left" />QR</button>
      </div>
      <Steps at={3} />
      <h1 className="h1">Payment confirm karein</h1>
      <div className="row" style={{ marginBottom: 16, gap: 8 }}><span className="remark-chip">{entry.remark}</span><span className="small muted ellipsis">{entry.qrName}</span></div>
      <div className="card">
        <label className="field">
          <span className="lbl">Actual received amount</span>
          <div className="prefix-field"><span>₹</span>
            <input className="input num" style={{ fontSize: 22, fontWeight: 650 }} inputMode="decimal" value={amountStr}
              onChange={(e) => setAmountStr(e.target.value.replace(/[^0-9.,]/g, ""))} />
          </div>
          <div className="hint">{changed ? <span style={{ color: "var(--warn)", fontWeight: 600 }}>QR {rupees(entry.amount)} ka tha. Save karne pe {rupees(amount)} judega.</span> : "Customer ne alag amount bheja ho toh yahan sahi amount likhein."}</div>
        </label>
        <PhotoPicker value={photo} onChange={setPhoto} required={photoRequired} />
      </div>
      <Overlay><div className="action-bar"><div>
        <button className="btn ok block big" disabled={busy || !(amount > 0) || (photoRequired && !photo)} onClick={save}>
          {busy ? <><Spinner />Save ho raha hai</> : <><Icon n="check-circle" />Save</>}
        </button>
      </div></div></Overlay>
    </div>
  );
}

function SuccessScreen({ amount, remark, qrName, onNext }) {
  const [closing, setClosing] = useState(false);
  const next = useCallback(() => { setClosing(true); setTimeout(onNext, EXIT_MS); }, [onNext]);

  return (
    <Overlay><div className={"success" + (closing ? " closing" : "")} role="status">
      <div className="burst"><Icon n="check-circle" fill /></div>
      <div className="s-amt num">{rupees(amount)}</div>
      <div className="s-sub">Add ho gaya. {remark} <span className="muted">({qrName})</span></div>

}

   ENTRIES (branch: own, current month; admin: everything)

function canEdit(e, role, now) {
  if (role.isAdmin) return true;
  return e.branch === role.email && now - (e.createdAtMs || 0) < EDIT_WINDOW_MS;
}

function EntryList({ entries, role, now, onEdit, onPhoto, showBranch, selected, onToggle }) {
  if (!entries.length) return <Empty icon="receipt" title="Koi entry nahi">Filters badal ke dekhein.</Empty>;
  const selecting = !!selected;
  return (
    <div className="stagger">
      {entries.map((e, i) => {
        const editable = e.status === "received" && canEdit(e, role, now);
        const locked = e.status === "received" && !editable;
        const isSel = selecting && selected.has(e.id);
        return (
          <div className={"list-item" + (selecting ? " selectable" : "") + (isSel ? " sel" : "")} key={e.id} style={{ "--i": i }}
            onClick={selecting ? () => onToggle(e.id) : undefined} role={selecting ? "checkbox" : undefined} aria-checked={selecting ? isSel : undefined}>
            {selecting && <Icon n={isSel ? "check-circle" : "circle"} fill={isSel} className="check-ic" />}
            <div className="grow">
              <div className="row wrap" style={{ gap: 6 }}>
                <span className="remark-chip">{e.remark}</span>
                <StatusBadge e={e} />
                {locked && <span className="badge"><Icon n="lock-simple" />Locked</span>}
              </div>
              <div className="meta">
                <span>{e.qrName}</span>
                {showBranch && <span className="badge">{e.branchName}</span>}
                <span>{fmtDateTime(e.createdAtMs)}</span>
              </div>
              {e.originalAmount != null && e.status === "received" && <div className="tiny muted" style={{ marginTop: 2 }}>Pehle {rupees(e.originalAmount)} tha, edit: {e.editedBy}</div>}
              {e.note && <div className="tiny muted" style={{ marginTop: 2 }}>Note: {e.note}</div>}
            </div>
            <div className="right">
              <div className={"amt " + (e.status === "received" ? (e.amount < 0 ? "neg" : "") : "strike")}>{rupees(e.status === "deleted" ? e.deletedAmount : e.amount)}</div>
              {!selecting && (e.hasPhoto || editable) && <div className="row" style={{ gap: 4, justifyContent: "flex-end", marginTop: 6 }}>
                {e.hasPhoto && <button className="btn sm ghost" onClick={() => onPhoto(e)} aria-label="Photo dekho"><Icon n="image" /></button>}
                {editable && <button className="btn sm ghost" onClick={() => onEdit(e)} aria-label="Edit"><Icon n="pencil-simple" />Edit</button>}
              </div>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function EditEntryModal({ entry, role, onClose }) {
  const toast = useToast();
  const ask = useConfirm();
  const [closing, close] = useSheet(onClose);
  const [amountStr, setAmountStr] = useState(String(entry.amount));
  const [note, setNote] = useState(entry.note || "");
  const [photo, setPhoto] = useState(null);
  const [busy, setBusy] = useState(false);
  const amount = parseAmount(amountStr);
  const allowNegative = entry.type === "adjustment";
  async function save(del) {
    if (!del && !(allowNegative ? amount !== 0 && isFinite(amount) : amount > 0)) { toast("Sahi amount daalein.", true); return; }
    if (del && !(await ask({ title: "Entry delete karein?", body: `${entry.remark} ka ${rupees(entry.amount)} QR total se hat jaayega.`, okLabel: "Delete", danger: true }))) return;
    setBusy(true);
    try {
      await editEntry(entry, { amount, photo, note: role.isAdmin ? note : undefined, del }, role);
      toast(del ? "Entry delete ho gayi." : "Entry update ho gayi.");
      close();
    } catch (e) { toast(errMsg(e), true); setBusy(false); }
  }
  return (
    <Sheet title={`Edit ${entry.remark}`} closing={closing} onClose={close}>
      {!role.isAdmin && <Alert kind="info" icon="clock">Edit sirf {fmtDateTime((entry.createdAtMs || 0) + EDIT_WINDOW_MS)} tak ho sakta hai.</Alert>}
      <div className="meta small muted" style={{ marginBottom: 14, display: "flex", gap: 8, flexWrap: "wrap" }}>
        <span>{entry.qrName}</span><span className="badge">{entry.branchName}</span><span>{fmtDateTime(entry.createdAtMs)}</span>
      </div>
      <label className="field"><span className="lbl">Amount</span>
        <div className="prefix-field"><span>₹</span>
          <input className="input num" inputMode="decimal" value={amountStr} onChange={(e) => setAmountStr(e.target.value.replace(allowNegative ? /[^0-9.,-]/g : /[^0-9.,]/g, ""))} />
        </div>
      </label>
      {role.isAdmin && <label className="field"><span className="lbl">Note</span><input className="input" value={note} onChange={(e) => setNote(e.target.value)} /></label>}
      {entry.type === "payment" && <PhotoPicker value={photo} onChange={setPhoto} required={false} />}
      {entry.hasPhoto && !photo && <div className="hint" style={{ marginTop: -6, marginBottom: 14 }}>Photo pehle se hai. Nayi lagayenge toh purani replace ho jaayegi.</div>}
      <div className="btn-row">
        <button className="btn ghost" style={{ color: "var(--bad)", flex: "0 0 auto" }} disabled={busy} onClick={() => save(true)}><Icon n="trash" />Delete</button>
        <button className="btn" disabled={busy} onClick={() => save(false)}>{busy ? <Spinner /> : <Icon n="check" />}Save</button>
      </div>
    </Sheet>
  );
}

function QrUsageCard({ q, total, now, today, live }) {
  const u = usageFor(total, live ? now : 0);
  const off = !q.enabled, exp = isExpired(q, today);
  const lvl = levelFor(u.used, q.limit);
  const badge = q.archived ? <span className="badge"><Icon n="archive" />Archived</span>
    : off ? <span className="badge">Disabled</span>
    : exp ? <span className="badge">Expired</span>
    : lvl === "red" ? <span className="badge bad">Limit full</span>
    : lvl === "yellow" ? <span className="badge warn">90%+</span>
    : <span className="badge ok">Active</span>;
  return (
    <div className="card" style={{ padding: 14, opacity: off || exp || q.archived ? 0.7 : 1 }}>
      <div className="row" style={{ marginBottom: 10 }}>
        <div className="grow">
          <div style={{ fontWeight: 600 }} className="ellipsis">{q.name}</div>
          <div className="tiny muted mono ellipsis">{q.upiId}</div>
        </div>
        {badge}
      </div>
      <UsageBar used={u.used} limit={q.limit} />
      <div className="row tiny muted num" style={{ marginTop: 6 }}>
        <span className="grow">{rupees(u.received)} received{u.held ? `, ${rupees(u.held)} pending` : ""}</span>
        <span><b style={{ color: "var(--ink-2)" }}>{pct(u.used, q.limit)}%</b> of {rupees(q.limit)}</span>
      </div>
    </div>
  );
}

function Dashboard({ role, qrs, now }) {
  const toast = useToast();
  const ask = useConfirm();
  const [month, setMonth] = useState(monthKey(now));
  const [fBranch, setFBranch] = useState("");
  const [fQr, setFQr] = useState("");
  const [fStatus, setFStatus] = useState("received");
  const [editing, setEditing] = useState(null);
  const [photoOf, setPhotoOf] = useState(null);
  const [adjOpen, setAdjOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const [selected, setSelected] = useState(null);   // Set of entry ids while in select mode

  const totalsS = useSnapshot(() => db.collection("totals").where("month", "==", month), [month]);
  const entriesS = useSnapshot(() => db.collection("entries").where("month", "==", month), [month]);
  const tmap = byQr(totalsS.data);
  const all = (entriesS.data || []).slice().sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
  const today = dayKey(now);
  const isCurrent = month === monthKey(now);

  const qrList = (qrs || []).filter((q) => !q.archived || (tmap[q.id] && Number(tmap[q.id].received))).sort((a, b) => {
    const aa = a.enabled && !a.archived && !isExpired(a, today), bb = b.enabled && !b.archived && !isExpired(b, today);
    return (bb - aa) || b.limit - a.limit || (a.createdAtMs || 0) - (b.createdAtMs || 0);
  });
  const received = all.filter((e) => e.status === "received");
  const grand = received.reduce((a, e) => a + e.amount, 0);
  const pendingCount = all.filter((e) => e.status === "pending").length;
  const activeCount = activeQrs(qrs, today).length;
  const branchSums = {};
  received.forEach((e) => { branchSums[e.branchName] = (branchSums[e.branchName] || 0) + e.amount; });

  const filtered = all.filter((e) => (!fBranch || e.branch === fBranch) && (!fQr || e.qrId === fQr) && (!fStatus || e.status === fStatus));
  const branchOpts = [...BRANCHES.map((b) => ({ v: b.email, l: b.name })), { v: ADMIN_EMAIL, l: "Owner" }];
  useEffect(() => { setSelected((s) => (s ? new Set() : s)); }, [month, fBranch, fQr, fStatus]);
  const picked = selected ? filtered.filter((e) => selected.has(e.id)) : [];
  const pickedLive = picked.filter((e) => e.status === "received" || e.status === "pending");
  const pickedGone = picked.filter((e) => e.status === "deleted" || e.status === "cancelled");
  const pickedSum = picked.filter((e) => e.status === "received").reduce((a, e) => a + e.amount, 0);
  const allPicked = filtered.length > 0 && picked.length === filtered.length;

  function toggle(id) {
    setSelected((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  }
  async function deletePicked() {
    const ok = await ask({ title: `${pickedLive.length} entries delete karein?`, body: pickedSum ? `${rupees(pickedSum)} QR totals se hat jaayega. Pending entries cancel ho jaayengi.` : "Pending entries cancel ho jaayengi.", okLabel: "Delete", danger: true });
    if (!ok) return;
    setBusy(true);
    try { const n = await bulkDeleteEntries(pickedLive, role); toast(`${n} entries delete ho gayi.`); setSelected(new Set()); }
    catch (e) { toast(errMsg(e), true); }
    finally { setBusy(false); }
  }
  async function purgePicked() {
    const ok = await ask({ title: "Hamesha ke liye hata dein?", body: `${pickedGone.length} deleted/cancelled entries poori tarah hat jaayengi. Yeh wapas nahi aayengi.`, okLabel: "Hata do", danger: true, icon: "trash" });
    if (!ok) return;
    setBusy(true);
    try { const n = await purgeEntries(pickedGone); toast(`${n} entries hamesha ke liye hata di gayi.`); setSelected(new Set()); }
    catch (e) { toast(errMsg(e), true); }
    finally { setBusy(false); }
  }
  async function recalc() {
    if (!(await ask({ title: "Totals dobara calculate karein?", body: `${monthLabel(month)} ke saare QR totals entries se dobara banenge.`, okLabel: "Recalculate", icon: "arrows-clockwise" }))) return;
    setBusy(true);
    try { await recalcTotals(month, qrs || []); toast("Totals dobara calculate ho gaye."); }
    catch (e) { toast(errMsg(e), true); }
    finally { setBusy(false); }
  }

  return (
    <div className="page enter">
      <div className="hero-card">
        <div className="row">
          <span className="lbl grow">Total received</span>
          <label className="month-pill"><Icon n="calendar-blank" />{monthLabel(month)}<Icon n="caret-down" />
            <input type="month" value={month} max={monthKey(now)} aria-label="Month chuno" onChange={(e) => e.target.value && setMonth(e.target.value)} />
          </label>
        </div>
        <div className="big"><CountUp value={grand} /></div>
        <div className="hero-stats">
          <div><div className="v">{received.length}</div><div className="l">Entries</div></div>
          <div><div className="v">{pendingCount}</div><div className="l">Pending</div></div>
          <div><div className="v">{activeCount}</div><div className="l">Active QR</div></div>
        </div>
      </div>

      <div className="section-title">QR status</div>
      {totalsS.loading ? <div className="card"><div className="skel" style={{ height: 14, width: "40%" }} /><div className="skel" style={{ height: 8, marginTop: 14 }} /></div>
        : !qrList.length ? <div className="card"><Empty icon="qr-code" title="Abhi koi QR nahi">QRs tab se add karein.</Empty></div>
        : <div className="stagger">{qrList.map((q, i) => <div key={q.id} style={{ "--i": i }}><QrUsageCard q={q} total={tmap[q.id]} now={now} today={today} live={isCurrent} /></div>)}</div>}

      {Object.keys(branchSums).length > 0 && <>
        <div className="section-title">Branch-wise</div>
        <div className="stat-grid stagger">
          {Object.entries(branchSums).sort((a, b) => b[1] - a[1]).map(([b, v], i) => (
            <div className="stat" key={b} style={{ "--i": i }}><div className="v"><CountUp value={v} /></div><div className="l">{b}</div></div>
          ))}
        </div>
      </>}

      <div className="row" style={{ margin: "22px 2px 10px" }}>
        <div className="section-title grow" style={{ margin: 0 }}>Entries ({filtered.length})</div>
        <button className="btn sm ghost" onClick={() => setSelected(selected ? null : new Set())}>
          {selected ? <><Icon n="x" />Done</> : <><Icon n="check-square" />Select</>}
        </button>
      </div>
      <div className="filters">
        <select className="input" value={fStatus} onChange={(e) => setFStatus(e.target.value)} aria-label="Status filter">
          <option value="received">Received</option><option value="pending">Pending</option>

function AdjustmentModal({ month, qrs, onClose }) {
  const toast = useToast();
  const [closing, close] = useSheet(onClose);
  const [qrId, setQrId] = useState(qrs[0] ? qrs[0].id : "");
  const [amountStr, setAmountStr] = useState("");

    try { await addAdjustment({ month, qr, amount, note }); toast("Adjustment add ho gaya."); close(); }

  }
  return (
    <Sheet title={`Adjustment, ${monthLabel(month)}`} closing={closing} onClose={close}>

        </div>

      </label>
      <label className="field"><span className="lbl">Note</span><input className="input" placeholder="Kyun?" value={note} onChange={(e) => setNote(e.target.value)} /></label>
      <button className="btn block big" disabled={busy} onClick={save}>{busy ? <Spinner /> : <Icon n="check" />}Save adjustment</button>

// Archive = take a QR out of use but keep its history (restorable).
// Permanent delete only for an archived QR that has never had an entry,
// i.e. one added by mistake or for testing.
async function deleteQrForever(q) {
  const used = await db.collection("entries").where("qrId", "==", q.id).limit(1).get();
  if (!used.empty) throw new Error("Is QR pe entries hain, isliye delete nahi ho sakta. Archive mein rehne do.");
  const totals = await db.collection("totals").where("qrId", "==", q.id).get();
  const batch = db.batch();
  totals.forEach((d) => batch.delete(d.ref));
  batch.delete(db.doc(`qrImages/${q.id}`));
  batch.delete(db.doc(`qrs/${q.id}`));
  await batch.commit();
}

function QrsTab({ qrs, settings, now }) {
  const toast = useToast();
  const ask = useConfirm();
  const [editing, setEditing] = useState(null);   // qr object, or {} for new
  const [view, setView] = useState("main");        // main | archived
  const [busyId, setBusyId] = useState(null);
  const today = dayKey(now);
  const sorted = (qrs || []).slice().sort((a, b) => b.limit - a.limit || (a.createdAtMs || 0) - (b.createdAtMs || 0));
  const archived = sorted.filter((q) => q.archived);
  const list = view === "archived" ? archived : sorted.filter((q) => !q.archived);

  async function run(q, fn, okMsg) {
    setBusyId(q.id);
    try { await fn(); if (okMsg) toast(okMsg); } catch (e) { toast(errMsg(e), true); } finally { setBusyId(null); }
  }
  const toggleEnabled = (q, v) => run(q, () => db.doc(`qrs/${q.id}`).update({ enabled: v }));
  const archive = async (q) => {
    if (!(await ask({ title: `${q.name} archive karein?`, body: "Yeh QR band ho jaayega aur Archived tab mein chala jaayega. History bachi rahegi.", okLabel: "Archive", icon: "archive" }))) return;
    run(q, () => db.doc(`qrs/${q.id}`).update({ archived: true, enabled: false, archivedAtMs: Date.now() }), "QR archive ho gaya.");
  };
  const restore = (q) => run(q, () => db.doc(`qrs/${q.id}`).update({ archived: false }), "QR wapas aa gaya. Abhi disabled hai, on kar dein.");
  const remove = async (q) => {
    if (!(await ask({ title: `${q.name} delete karein?`, body: "Hamesha ke liye. Yeh wapas nahi aayega.", okLabel: "Delete", danger: true, icon: "trash" }))) return;
    run(q, () => deleteQrForever(q), "QR delete ho gaya.");
  };

  return (
    <div className="page enter">
      <Segmented value={view} onChange={setView} options={[
        { v: "main", label: `QRs (${sorted.length - archived.length})`, icon: "qr-code" },
        { v: "archived", label: `Archived (${archived.length})`, icon: "archive" },
      ]} />
      {view === "main" ? <>
        <button className="btn block big" onClick={() => setEditing({})}><Icon n="plus" />Naya QR add karo</button>
        <div className="hint" style={{ margin: "10px 2px 4px" }}>Sabse badi limit wala QR pehle use hota hai. Thodi der ke liye band karna ho toh toggle off karo, hamesha ke liye hatana ho toh Archive.</div>
      </> : <div className="hint" style={{ margin: "0 2px 4px" }}>Archived QR kabhi use nahi hote, history bachi rehti hai. Delete sirf us QR pe hota hai jispe kabhi koi entry nahi hui.</div>}
      {!list.length && <div className="card" style={{ marginTop: 12 }}>
        {view === "archived" ? <Empty icon="archive" title="Koi archived QR nahi" /> : <Empty icon="qr-code" title="Abhi koi QR nahi">Upar wale button se pehla QR add karein.</Empty>}
      </div>}
      <div className="stagger" key={view}>
        {list.map((q, i) => {
          const exp = isExpired(q, today);
          const busy = busyId === q.id;
          return (
            <div className="card" key={q.id} style={{ "--i": i, padding: 14, marginTop: 12, opacity: q.archived ? 0.85 : 1 }}>
              <div className="row" style={{ alignItems: "flex-start" }}>
                <div className="grow">
                  <div style={{ fontWeight: 600, fontSize: 15.5 }} className="ellipsis">{q.name}</div>
                  <div className="tiny muted mono ellipsis">{q.upiId}</div>
                  <div className="row wrap" style={{ gap: 6, marginTop: 8 }}>
                    <span className="badge info num">Limit {rupees(q.limit)}</span>
                    {q.archived ? <span className="badge"><Icon n="archive" />Archived {q.archivedAtMs ? fmtDateTime(q.archivedAtMs).split(",")[0] : ""}</span>
                      : exp ? <span className="badge bad">Expired {fmtDate(q.expiryDate)}</span>
                      : q.expiryEnabled && q.expiryDate ? <span className="badge warn"><Icon n="calendar-blank" />{fmtDate(q.expiryDate)} tak</span> : <span className="badge">Permanent</span>}
                    {!q.archived && (q.photoRequired || settings.photoRequiredAll) && <span className="badge"><Icon n="camera" />Photo zaroori</span>}
                  </div>
                </div>
                {!q.archived && <span className="switch" title={q.enabled ? "On hai" : "Off hai"}>
                  <input type="checkbox" checked={!!q.enabled} disabled={busy} aria-label={`${q.name} on/off`} onChange={(e) => toggleEnabled(q, e.target.checked)} />
                  <span className="sl" onClick={() => !busy && toggleEnabled(q, !q.enabled)} />
                </span>}
              </div>
              <div className="btn-row" style={{ marginTop: 12 }}>
                {q.archived ? <>
                  <button className="btn sm ghost" disabled={busy} onClick={() => restore(q)}><Icon n="arrow-counter-clockwise" />Restore</button>
                  <button className="btn sm ghost" style={{ color: "var(--bad)" }} disabled={busy} onClick={() => remove(q)}><Icon n="trash" />Delete</button>
                </> : <>
                  <button className="btn sm ghost" disabled={busy} onClick={() => setEditing(q)}><Icon n="pencil-simple" />Edit</button>
                  <button className="btn sm ghost" disabled={busy} onClick={() => archive(q)}><Icon n="archive" />Archive</button>
                </>}
              </div>
            </div>
          );
        })}
      </div>
      {editing && <QrForm qr={editing} onClose={() => setEditing(null)} />}
    </div>
  );
}

function QrForm({ qr, onClose }) {
  const toast = useToast();
  const [closing, close] = useSheet(onClose);
  const isNew = !qr.id;
  const [name, setName] = useState(qr.name || "");
  const [upiId, setUpiId] = useState(qr.upiId || "");
  const [payeeName, setPayeeName] = useState(qr.payeeName || "");
  const [limitStr, setLimitStr] = useState(qr.limit ? String(qr.limit) : "");
  const [enabled, setEnabled] = useState(isNew ? true : !!qr.enabled);
  const [expiryEnabled, setExpiryEnabled] = useState(!!qr.expiryEnabled);
  const [expiryDate, setExpiryDate] = useState(qr.expiryDate || "");
  const [photoRequired, setPhotoRequired] = useState(!!qr.photoRequired);
  const [image, setImage] = useState(null);       // new compressed image
  const [existingImg, setExistingImg] = useState(null);
  const [scan, setScan] = useState(null);         // { ok, msg, busy }
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);

  useEffect(() => {
    if (isNew) return;
    db.doc(`qrImages/${qr.id}`).get().then((s) => { if (s.exists) setExistingImg(s.data().data); }).catch(() => {});
  }, []);

  async function onFile(e) {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    setScan({ busy: true, msg: "QR padh rahe hain" });
    try {
      const text = await decodeQrFromFile(f);
      const upi = parseUpi(text);
      if (upi) {
        setUpiId(upi.pa);
        if (upi.pn) setPayeeName(upi.pn);
        if (!name) setName(upi.pn || upi.pa);
        setScan({ ok: true, msg: `UPI ID mil gayi: ${upi.pa}` });
      } else if (text) {
        setScan({ ok: false, msg: "QR mila par yeh UPI QR nahi lagta. UPI ID khud likhein." });
      } else {
        setScan({ ok: false, msg: "QR padha nahi gaya. Saaf ya crop ki hui photo try karein, ya UPI ID khud likhein." });
      }
      setImage(await compressImage(f, { maxDim: 900, maxChars: 300000, quality: 0.85 }));
    } catch (err) { setScan({ ok: false, msg: errMsg(err) }); }
  }

  async function save() {
    const limit = parseAmount(limitStr);
    const pa = upiId.trim();
    if (!name.trim()) { toast("QR ka naam daalein.", true); return; }
    if (!/^[\w.\-]+@[\w.\-]+$/.test(pa)) { toast("UPI ID sahi nahi lag rahi (jaise name@okhdfc).", true); return; }
    if (!(limit > 0)) { toast("Monthly limit daalein.", true); return; }
    if (expiryEnabled && !expiryDate) { toast("Expiry date chunein.", true); return; }
    if (isNew && !image) { toast("QR photo upload karein.", true); return; }
    setBusy(true);
    try {
      const ref = isNew ? db.collection("qrs").doc() : db.doc(`qrs/${qr.id}`);
      if (image) await db.doc(`qrImages/${ref.id}`).set({ data: image });
      const data = {
        name: name.trim(), upiId: pa, payeeName: payeeName.trim(), limit, enabled,
        expiryEnabled, expiryDate: expiryEnabled ? expiryDate : "", photoRequired,
        hasImage: !!(image || existingImg || qr.hasImage),
      };
      if (isNew) { data.createdAt = FV.serverTimestamp(); data.createdAtMs = Date.now(); }
      await ref.set(data, { merge: true });
      toast(isNew ? "QR add ho gaya." : "QR update ho gaya.");
      close();
    } catch (e) { toast(errMsg(e), true); setBusy(false); }
  }

  const shownImg = image || existingImg;
  return (
    <Sheet title={isNew ? "Naya QR" : "QR edit"} closing={closing} onClose={close}>
      <input ref={fileRef} type="file" accept="image/*" hidden onChange={onFile} />
      {shownImg ? <>
        <img src={shownImg} className="photo-prev" style={{ marginBottom: 10 }} alt="QR" />
        <button className="btn sm soft block" onClick={() => fileRef.current.click()}><Icon n="image" />QR photo badlo</button>
      </> : (
        <button className="drop" onClick={() => fileRef.current.click()}><Icon n="scan" />QR photo upload karo<span className="tiny" style={{ fontWeight: 500 }}>UPI ID apne aap padh li jaayegi</span></button>
      )}
      {scan && <div style={{ marginTop: 10 }}>
        {scan.busy ? <Alert kind="info" icon="circle-notch">{scan.msg}</Alert>
          : <Alert kind={scan.ok ? "info" : "yellow"} icon={scan.ok ? "seal-check" : "warning"}>{scan.msg}</Alert>}
      </div>}
      <div style={{ height: 14 }} />
      <label className="field"><span className="lbl">QR ka naam</span><input className="input" placeholder="jaise Ramesh SBI" value={name} onChange={(e) => setName(e.target.value)} /></label>
      <label className="field"><span className="lbl">UPI ID</span>
        <input className="input mono" autoCapitalize="none" autoCorrect="off" spellCheck={false} placeholder="name@okhdfcbank" value={upiId} onChange={(e) => setUpiId(e.target.value.replace(/\s/g, ""))} />
        <div className="hint">Photo se apne aap aati hai. Ek baar check zaroor karein.</div>
      </label>
      <label className="field"><span className="lbl">Account holder ka naam</span><input className="input" value={payeeName} onChange={(e) => setPayeeName(e.target.value)} />
        <div className="hint">Customer ke UPI app mein yahi naam dikhega.</div>
      </label>
      <label className="field"><span className="lbl">Monthly limit</span>
        <div className="prefix-field"><span>₹</span><input className="input num" inputMode="numeric" placeholder="100000" value={limitStr} onChange={(e) => setLimitStr(e.target.value.replace(/[^0-9.,]/g, ""))} /></div>
        {parseAmount(limitStr) > 0 && <div className="hint num">{rupees(parseAmount(limitStr))}</div>}
      </label>
      <div className="card flat" style={{ padding: "2px 14px", background: "var(--surface-2)" }}>
        <Toggle label="Enabled" sub="Off karne par yeh QR kabhi nahi dikhega" checked={enabled} onChange={setEnabled} />
        <Toggle label="Expiry set karo" sub="Off ho toh permanent" checked={expiryEnabled} onChange={setExpiryEnabled} />
        {expiryEnabled && <label className="field" style={{ padding: "10px 0 2px", animation: "fadeUp var(--t-med) var(--ease-out) both" }}><span className="lbl">Last date (is din tak chalega)</span>
          <input type="date" className="input" value={expiryDate} onChange={(e) => setExpiryDate(e.target.value)} /></label>}
        <Toggle label="Reference photo zaroori" sub="Is QR ki har payment pe photo leni padegi" checked={photoRequired} onChange={setPhotoRequired} />
      </div>
      <button className="btn block big" style={{ marginTop: 6 }} disabled={busy} onClick={save}>{busy ? <><Spinner />Save ho raha hai</> : <><Icon n="check" />Save</>}</button>
    </Sheet>
  );
}

    const m = parseAmount(marginStr);
    if (!(m >= 0)) { toast("Sahi margin daalein.", true); return; }
    setBusy(true);
    try { await db.doc("settings/global").set({ margin: m }, { merge: true }); toast("Margin save ho gaya."); }
    catch (e) { toast(errMsg(e), true); } finally { setBusy(false); }
  }
  async function setPhotoAll(v) {
    try { await db.doc("settings/global").set({ photoRequiredAll: v }, { merge: true }); }
    catch (e) { toast(errMsg(e), true); }
  }
  return (
    <div className="page enter">
      <h1 className="h1">Settings</h1>
      <div className="card">
        <h3>Over-limit margin</h3>
        <div className="small muted" style={{ marginBottom: 12 }}>
