          <button className="btn" disabled={busy || !dirty} onClick={saveMargin}>Save</button>
        </div>
      </div>
      <div className="card" style={{ padding: "2px 16px" }}>
        <Toggle label="Sab QR pe reference photo zaroori" sub="On: har payment pe photo leni padegi. Off: sirf un QR pe jinpe alag se on hai." checked={settings.photoRequiredAll} onChange={setPhotoAll} />
      </div>
      <div className="card flat small muted" style={{ background: "var(--surface-2)" }}>
        <div className="row" style={{ marginBottom: 8 }}><Icon n="user-circle" /><span>Logged in: <b style={{ color: "var(--ink-2)" }}>{role.email}</b></span></div>
        <div className="row" style={{ marginBottom: 8, alignItems: "flex-start" }}><Icon n="hourglass" /><span>Pending payment {HOLD_MINUTES} min tak QR limit mein reserve rehti hai.</span></div>
        <div className="row" style={{ alignItems: "flex-start" }}><Icon n="lock-simple" /><span>Branch entry {EDIT_WINDOW_HOURS} ghante baad lock ho jaati hai.</span></div>
      </div>
    </div>
  );

function Main({ role }) {

  const month = monthKey(now);

  const [tab, setTab] = useState("receive");
  const [inFlow, setInFlow] = useState(false);
  const settingsS = useSnapshot(() => db.doc("settings/global"), []);
  const qrsS = useSnapshot(() => db.collection("qrs"), []);
  const totalsS = useSnapshot(() => db.collection("totals").where("month", "==", month), [month]);
  const settings = { ...DEFAULT_SETTINGS, ...(settingsS.data || {}) };
  const qrs = qrsS.data || [];
  useEffect(() => { document.body.classList.toggle("in-flow", inFlow); }, [inFlow]);

  const tabs = role.isAdmin
    ? [["receive", "hand-coins", "Receive"], ["dash", "chart-pie-slice", "Dashboard"], ["qrs", "qr-code", "QRs"], ["settings", "gear-six", "Settings"]]
    : [["receive", "hand-coins", "Receive"], ["mine", "receipt", "Entries"]];
  const at = tabs.findIndex((t) => t[0] === tab);

  let body;
  if (qrsS.loading || settingsS.loading) body = <div className="page"><div className="skel" style={{ height: 28, width: "70%", marginBottom: 16 }} /><div className="skel" style={{ height: 84, borderRadius: 18 }} /><div className="skel" style={{ height: 52, marginTop: 14, borderRadius: 14 }} /></div>;
  else if (qrsS.error) body = <div className="page"><Alert kind="red">{errMsg(qrsS.error)}</Alert></div>;
  else if (tab === "receive") body = <ReceiveTab role={role} settings={settings} qrs={qrs} totals={totalsS.data} now={now} onFlowChange={setInFlow} />;
  else if (tab === "mine") body = <MyEntriesTab role={role} now={now} />;
  else if (tab === "dash") body = <Dashboard role={role} qrs={qrs} now={now} />;
  else if (tab === "qrs") body = <QrsTab qrs={qrs} settings={settings} now={now} />;
  else if (tab === "settings") body = <SettingsTab settings={settings} role={role} />;

  return (
    <div className={"app" + (inFlow ? " in-flow" : "")}>
      <header className="top">
        <img src="icons/icon-192.png" className="logo-sm" alt="" />
        <div className="grow">
          <div className="title">QR Tracker</div>
          <div className="sub">{role.name}, {monthLabel(month)}</div>
        </div>
        <button className="icon-btn" aria-label="Logout" title="Logout" onClick={async () => {
          if (await ask({ title: "Logout karein?", body: "Dobara login karne ke liye password lagega.", okLabel: "Logout", icon: "sign-out" })) auth.signOut();
        }}><Icon n="sign-out" /></button>
      </header>
      <main key={tab}>{body}</main>
      <nav className={"tabs" + (inFlow ? " hidden" : "")} aria-hidden={inFlow}>
        <div className="tabs-inner" style={{ "--n": tabs.length, "--at": at }}>
          <div className="tab-ind" />
          {tabs.map(([k, ic, l]) => (
            <button key={k} className={"tab" + (tab === k ? " on" : "")} aria-current={tab === k ? "page" : undefined}
              onClick={() => { if (k !== tab) { setTab(k); window.scrollTo(0, 0); } }}>
              <Icon n={ic} fill={tab === k} />{l}
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
}

  const [show, setShow] = useState(false);
  const [busy, setBusy] = useState(false);
  const pwRef = useRef(null);
  async function submit(e) {
    e.preventDefault();
    const email = who === "admin" ? ADMIN_EMAIL : BRANCHES.find((b) => b.id === who).email;
    setBusy(true);
    try { await auth.signInWithEmailAndPassword(email, pw); }
    catch (err) { toast(errMsg(err), true); setBusy(false); }
  }
  function pick(id) { setWho(id); setTimeout(() => pwRef.current && pwRef.current.focus(), 0); }
  return (
    <div className="login-wrap">
      <form className="login-card" onSubmit={submit}>
        <img src="icons/icon-192.png" className="logo" alt="" />
        <h1 className="h1" style={{ marginBottom: 4 }}>QR Tracker</h1>
        <div className="muted" style={{ marginBottom: 20 }}>Apni branch chuno aur password daalo.</div>
        <div className="tiles" role="radiogroup" aria-label="Login">
          {BRANCHES.map((b) => (
            <button type="button" key={b.id} role="radio" aria-checked={who === b.id} className={"tile" + (who === b.id ? " on" : "")} onClick={() => pick(b.id)}>
              <Icon n="storefront" fill={who === b.id} /><span className="ellipsis">{b.name}</span>
            </button>
          ))}
          <button type="button" role="radio" aria-checked={who === "admin"} className={"tile wide" + (who === "admin" ? " on" : "")} onClick={() => pick("admin")}>
            <Icon n="user-circle" fill={who === "admin"} />Owner (Admin)
          </button>
        </div>
        <label className="field"><span className="lbl">Password</span>
          <div style={{ position: "relative" }}>
            <input ref={pwRef} className="input" type={show ? "text" : "password"} autoComplete="current-password" value={pw} onChange={(e) => setPw(e.target.value)} style={{ paddingRight: 48 }} />
            <button type="button" className="icon-btn" aria-label={show ? "Password chhupao" : "Password dikhao"} onClick={() => setShow(!show)}
              style={{ position: "absolute", right: 4, top: "50%", transform: "translateY(-50%)", color: "var(--muted)", fontSize: 19 }}><Icon n={show ? "eye-slash" : "eye"} /></button>
          </div>
        </label>
        <button className="btn block big" disabled={busy || !pw}>{busy ? <><Spinner />Login ho raha hai</> : "Login"}</button>
      </form>
    </div>
  );
}

function SetupNeeded() {
  return (
    <div className="login-wrap">
      <div className="card login-card">
        <h2 style={{ marginTop: 0 }}>Setup baaki hai</h2>
        <p className="small muted">Firebase config abhi <code className="inline">index.html</code> mein paste nahi hua. Repo mein <code className="inline">SETUP.md</code> ke steps follow karein.</p>
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(undefined);
  const [toast, setToast] = useState(null);   // { msg, isError, id, leaving }
  const showToast = useCallback((msg, isError) => { setToast({ msg, isError, id: Date.now(), leaving: false }); }, []);
  useEffect(() => {
    if (!toast || toast.leaving) return;
    const t = setTimeout(() => setToast((x) => (x && x.id === toast.id ? { ...x, leaving: true } : x)), toast.isError ? 4200 : 2400);
    return () => clearTimeout(t);
  }, [toast]);
  useEffect(() => {
    if (!toast || !toast.leaving) return;
    const t = setTimeout(() => setToast((x) => (x && x.id === toast.id ? null : x)), EXIT_MS);
    return () => clearTimeout(t);
  }, [toast]);
  useEffect(() => (auth ? auth.onAuthStateChanged((u) => setUser(u || null)) : undefined), []);

  let body;
  if (CONFIG_MISSING) body = <SetupNeeded />;
  else if (user === undefined) body = <div className="login-wrap"><img src="icons/icon-192.png" className="logo" alt="" style={{ animation: "popIn 600ms var(--ease-out) both" }} /></div>;
  else if (!user) body = <Login />;
  else {
    const role = roleFor(user);
    body = role.unknown
      ? <div className="login-wrap"><div className="card login-card"><p>{role.email} is app ka login nahi hai.</p><button className="btn block" onClick={() => auth.signOut()}>Logout</button></div></div>
      : <Main role={role} key={role.email} />;
  }
  return (
    <ToastCtx.Provider value={showToast}>
      <ConfirmHost>
        {body}
        {toast && <div className={"toast" + (toast.isError ? " error" : "") + (toast.leaving ? " leaving" : "")} key={toast.id} role="status" aria-live="polite">
          <Icon n={toast.isError ? "warning-circle" : "check-circle"} fill />{toast.msg}
        </div>}
      </ConfirmHost>
    </ToastCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (err) { console.warn("SW register failed", err); });
    });
  }
</script>
</body>
