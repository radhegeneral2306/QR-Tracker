<style>
:root {
  --bg:        #f5f4f0;
  --surface:   #ffffff;
  --surface-2: #faf9f5;
  --sunken:    #f1efe8;
  --ink:       #1a1a18;
  --ink-2:     #3a3a38;
  --muted:     #5f5e5a;
  --muted-2:   #888780;
  --line:      #e3e1d8;
  --line-2:    #d3d1c7;

  --brand:      #14532d;
  --brand-2:    #166534;
  --brand-soft: #e3f1e6;

  --ok:         #3b8a1e;
  --ok-soft:    #e0f5e8;
  --warn:       #b7791f;
  --warn-soft:  #fdf0c4;
  --bad:        #c53030;
  --bad-soft:   #fde2e2;
  --info-soft:  #e6eefb;
  --info:       #2b5cb8;

  --radius: 14px;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.04);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { max-width: 600px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }

/* header */
.top {
  position: sticky; top: 0; z-index: 20;
  background: var(--brand); color: #fff;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  display: flex; align-items: center; gap: 10px;
}
.top .title { font-weight: 700; font-size: 16px; }
.top .sub { font-size: 12px; opacity: .8; }
.top .spacer { flex: 1; }
.top .logout { background: rgba(255,255,255,.14); border: 0; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; }

/* bottom tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs-inner { display: flex; width: 100%; max-width: 600px; }
.tab { flex: 1; border: 0; background: none; padding: 9px 4px 10px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tab .ic { font-size: 19px; line-height: 1; }
.tab.on { color: var(--brand); font-weight: 600; }

.page { padding: 14px 16px 24px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.card h3 { margin: 0 0 10px; font-size: 15px; }
.section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 18px 2px 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.right { text-align: right; }
.center { text-align: center; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* forms */
label.f { display: block; margin-bottom: 12px; }
label.f > span { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
.input, select.input, textarea.input {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px;
  padding: 11px 12px; font-size: 16px; outline: none;
}
.input:focus { border-color: var(--brand-2); background: #fff; }
.amount-input { font-size: 34px; font-weight: 700; text-align: center; padding: 14px 12px; letter-spacing: .01em; }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

.btn {
  border: 0; border-radius: 12px; padding: 13px 16px; font-size: 15px; font-weight: 600;
  background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:disabled { opacity: .5; cursor: default; }
.btn.block { width: 100%; }
.btn.big { padding: 16px; font-size: 17px; }
.btn.ok { background: var(--ok); }
.btn.bad { background: var(--bad); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); }
.btn.soft { background: var(--brand-soft); color: var(--brand); }
.btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 9px; }
.btn-row { display: flex; gap: 10px; }
.btn-row > * { flex: 1; }

/* toggle */
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.toggle:last-child { border-bottom: 0; }
.toggle .t-label { font-weight: 500; }
.toggle .t-sub { font-size: 12px; color: var(--muted); }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch .sl { position: absolute; inset: 0; background: var(--line-2); border-radius: 99px; transition: .15s; }
.switch .sl::after { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + .sl { background: var(--ok); }
.switch input:checked + .sl::after { transform: translateX(18px); }

/* badges */
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.info { background: var(--info-soft); color: var(--info); }

/* progress */
.bar { height: 9px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--ok); border-radius: 99px; }
.bar.yellow > div { background: #e0a526; }
.bar.red > div { background: var(--bad); }

.alert { border-radius: 12px; padding: 11px 13px; font-size: 14px; margin-bottom: 12px; }
.alert.yellow { background: var(--warn-soft); color: #7a5410; border: 1px solid #f1d98a; }
.alert.red { background: var(--bad-soft); color: #8f1f1f; border: 1px solid #f3b9b9; }
.alert.info { background: var(--info-soft); color: #1f437f; border: 1px solid #c6d6f2; }

/* QR display */
.qr-box { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; justify-content: center; }
.qr-box svg, .qr-box img { width: 100%; max-width: 300px; height: auto; display: block; }
.pay-amount { font-size: 32px; font-weight: 700; text-align: center; margin: 4px 0; }
.pay-meta { text-align: center; color: var(--muted); font-size: 13px; }
.remark-chip { display: inline-block; font-family: ui-monospace, Menlo, monospace; background: var(--brand-soft); color: var(--brand); padding: 3px 10px; border-radius: 8px; font-weight: 600; }

/* lists */
.list-item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.amt { font-weight: 700; white-space: nowrap; }
.amt.neg { color: var(--bad); }
.strike { text-decoration: line-through; color: var(--muted-2); }

.chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
.chip-row select { flex: none; width: auto; padding: 8px 10px; font-size: 14px; }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(20,20,18,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--surface); width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
.modal-head { display: flex; align-items: center; margin-bottom: 12px; }
.modal-head h2 { margin: 0; font-size: 17px; flex: 1; }
.x { border: 0; background: var(--sunken); border-radius: 50%; width: 32px; height: 32px; font-size: 16px; }
@media (min-width: 640px) {
  .modal-bg { align-items: center; }
  .modal { border-radius: 18px; }
}

.photo-prev { width: 100%; max-height: 260px; object-fit: contain; background: var(--sunken); border-radius: 12px; display: block; }
.thumb { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; background: var(--sunken); flex: none; }

/* toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 60; background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.toast.error { background: var(--bad); }

.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 16px; }
.login-card { width: 100%; max-width: 380px; }
.logo { width: 64px; height: 64px; border-radius: 16px; display: block; margin: 0 auto 10px; }
.spinner { width: 26px; height: 26px; border: 3px solid var(--line-2); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat .v { font-weight: 700; font-size: 17px; }
.stat .l { font-size: 12px; color: var(--muted); }
code.inline { background: var(--sunken); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
</style>
</head>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* =========================================================
   FIREBASE SETUP - paste your own project's config here
   (Firebase console -> Project settings -> Your apps -> Web app)
   ========================================================= */
const firebaseConfig = {
  apiKey: "PASTE_API_KEY_HERE",
  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_PROJECT_ID.firebasestorage.app",
  messagingSenderId: "PASTE_SENDER_ID",
  appId: "PASTE_APP_ID",
};

/* =========================================================
   LOGINS - one Firebase Auth user per branch + one owner.
   Create these exact emails in Firebase console -> Authentication.
   ADMIN_EMAIL must also match the one in firestore.rules.
   remarkName goes into the UPI remark, keep it short.
   ========================================================= */
const ADMIN_EMAIL = "admin@qrtracker.app";
const BRANCHES = [
  { id: "raipur",    name: "Raipur",       remarkName: "Raipur", email: "raipur@qrtracker.app" },
  { id: "durg",      name: "Durg",         remarkName: "Durg",   email: "durg@qrtracker.app" },
  { id: "jagdalpur", name: "Jagdalpur",    remarkName: "Jdp",    email: "jagdalpur@qrtracker.app" },
  { id: "hardware",  name: "Hardware Drg", remarkName: "HwDrg",  email: "hardware@qrtracker.app" },
];

// A generated-but-not-yet-received payment keeps its amount "reserved"
// on that QR for this long, so two branches can't both fill the same
// QR at once. After this it stops counting (staff forgot to press a
// button), but the entry stays in the open-payments list.
const HOLD_MINUTES = 30;
const EDIT_WINDOW_HOURS = 24;
const DEFAULT_SETTINGS = { margin: 10000, photoRequiredAll: false };

const HOLD_MS = HOLD_MINUTES * 60 * 1000;
const EDIT_WINDOW_MS = EDIT_WINDOW_HOURS * 60 * 60 * 1000;
const CONFIG_MISSING = !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("PASTE");

let db = null, auth = null;
if (!CONFIG_MISSING) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  // Local testing against the Firebase emulator: open with ?emulator on localhost.
  if (["localhost", "127.0.0.1"].includes(location.hostname) && new URLSearchParams(location.search).has("emulator")) {
    db.useEmulator("127.0.0.1", 8080);
    auth.useEmulator("http://127.0.0.1:9099", { disableWarnings: true });
  }
}
const FV = firebase.firestore.FieldValue;

/* =========================================================
   HELPERS
   ========================================================= */
// Always India Standard Time, whatever the phone's own timezone is.
const IST_OFFSET_MS = 5.5 * 60 * 60 * 1000;
const pad2 = (n) => String(n).padStart(2, "0");
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONTHS_FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

function istDate(ms = Date.now()) { return new Date(ms + IST_OFFSET_MS); }
function monthKey(ms = Date.now()) { const d = istDate(ms); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}`; }
function dayKey(ms = Date.now()) { const d = istDate(ms); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; }
function monthLabel(mk) { const [y, m] = mk.split("-").map(Number); return `${MONTHS_FULL[m - 1]} ${y}`; }
function fmtDateTime(ms) {
  if (!ms) return "";
  const d = istDate(ms);
  let h = d.getUTCHours(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}, ${h}:${pad2(d.getUTCMinutes())} ${ap}`;
}
function fmtDate(dk) { if (!dk) return ""; const [y, m, d] = dk.split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; }
function rupees(n) { return "₹" + (Number(n) || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 }); }
function parseAmount(s) {
  const n = Number(String(s ?? "").replace(/[,\s₹]/g, ""));
  if (!isFinite(n)) return NaN;
  return Math.round(n * 100) / 100;
}
function tsMs(v) { return v && typeof v.toMillis === "function" ? v.toMillis() : (typeof v === "number" ? v : 0); }

function roleFor(user) {
  if (!user) return null;
  const email = (user.email || "").toLowerCase();
  if (email === ADMIN_EMAIL) return { isAdmin: true, id: "admin", name: "Owner", remarkName: "Admin", email };
  const b = BRANCHES.find((x) => x.email === email);
  if (!b) return { unknown: true, email };
  return { isAdmin: false, ...b, remarkName: b.remarkName || b.name };
}
function branchName(email) {
  if (email === ADMIN_EMAIL) return "Owner";
  const b = BRANCHES.find((x) => x.email === email);
  return b ? b.name : email;
}

/* ---- QR limits ---- */
function isExpired(qr, today = dayKey()) { return !!(qr.expiryEnabled && qr.expiryDate && today > qr.expiryDate); }
function pruneHolds(holds, now) {
  const out = {};
  for (const [k, h] of Object.entries(holds || {})) if (h && h.at > now - HOLD_MS) out[k] = h;
  return out;
}
function usageFor(total, now = Date.now()) {
  const received = Number(total && total.received) || 0;
  let held = 0;
  for (const h of Object.values(pruneHolds(total && total.holds, now))) held += Number(h.amount) || 0;
  return { received, held, used: received + held };
}
// Enabled, not expired, highest limit first (older QR first on a tie).
function activeQrs(qrs, today = dayKey()) {
  return (qrs || [])
    .filter((q) => q.enabled && !isExpired(q, today) && q.upiId && Number(q.limit) > 0)
    .sort((a, b) => b.limit - a.limit || (a.createdAtMs || 0) - (b.createdAtMs || 0));
}
// Margin rule: a QR that is still under its limit can take one more payment
// that pushes it over, as long as it stays within limit + margin.
// Once it is at/over 100% it is skipped.
function qrFits(used, limit, amount, margin) { return used < limit && used + amount <= limit + margin; }
function levelFor(used, limit) {
  if (!limit) return "ok";
  const p = used / limit;
  return p >= 1 ? "red" : p >= 0.9 ? "yellow" : "ok";
}
function pct(used, limit) { return limit ? Math.round((used / limit) * 100) : 0; }

/* ---- UPI ---- */
function parseUpi(text) {
  if (!text) return null;
  const t = text.trim();
  if (!/^upi:\/\/pay/i.test(t)) return null;
  const qi = t.indexOf("?");
  if (qi < 0) return null;
  const p = new URLSearchParams(t.slice(qi + 1));
  const pa = (p.get("pa") || "").trim();
  if (!pa) return null;
  return { pa, pn: (p.get("pn") || "").trim() };
}
function upiLink({ upiId, payee, amount, remark }) {
  // UPI ids are plain [a-z0-9.-_@], left as-is: some apps choke on %40.
  const parts = [`pa=${upiId}`];
  if (payee) parts.push(`pn=${encodeURIComponent(payee)}`);
  parts.push(`am=${Number(amount).toFixed(2)}`, "cu=INR");
  if (remark) parts.push(`tn=${encodeURIComponent(remark)}`);
  return "upi://pay?" + parts.join("&");
}
function qrSvg(text) {
  const q = qrcode(0, "M");
  q.addData(text);
  q.make();
  return q.createSvgTag({ cellSize: 6, margin: 3, scalable: true });
}

/* ---- images ---- */
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, revoke: () => URL.revokeObjectURL(url) });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Photo open nahi hui. JPG/PNG try karein.")); };
    img.src = url;
  });
}
function drawScaled(img, maxDim) {
  const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.naturalWidth * scale));
  c.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return { c, ctx };
}
// Photos are stored inside Firestore (works on the free plan), so they must
// stay well under Firestore's 1 MB document limit. Target ~200 KB.
async function compressImage(file, { maxDim = 1100, maxChars = 270000, quality = 0.7 } = {}) {
  const { img, revoke } = await loadImage(file);
  try {
    let dim = maxDim, q = quality;
    for (let i = 0; i < 10; i++) {
      const { c } = drawScaled(img, dim);
      const url = c.toDataURL("image/jpeg", q);
      if (url.length <= maxChars) return url;
      if (q > 0.45) q -= 0.1; else dim = Math.round(dim * 0.8);
    }
    throw new Error("Photo bahut badi hai, dusri photo try karein.");
  } finally { revoke(); }
}
async function decodeQrFromFile(file) {
  const { img, revoke } = await loadImage(file);
  try {
    if ("BarcodeDetector" in window) {
      try {
        const det = new window.BarcodeDetector({ formats: ["qr_code"] });
        const found = await det.detect(img);
        if (found && found[0] && found[0].rawValue) return found[0].rawValue;
      } catch (e) { /* fall through to jsQR */ }
    }
    for (const dim of [1000, 700, 1500, 450]) {
      const { c, ctx } = drawScaled(img, dim);
      const data = ctx.getImageData(0, 0, c.width, c.height);
      const r = jsQR(data.data, c.width, c.height, { inversionAttempts: "attemptBoth" });
      if (r && r.data) return r.data;
    }
    return null;
  } finally { revoke(); }
}

function errMsg(e) {
  const code = (e && (e.code || e.message)) || "";
  if (code === "NO_QR") return "Koi bhi QR is amount ke liye available nahi hai. Owner se baat karein.";
  if (code === "ALREADY_DONE") return "Yeh payment pehle hi update ho chuki hai.";
  if (code === "NOT_FOUND") return "Entry nahi mili.";
  if (code === "permission-denied" || /permission/i.test(code)) return "Permission nahi hai (24 ghante ka lock, ya login issue).";
  if (code === "unavailable" || /offline|network/i.test(code)) return "Internet nahi hai. Connection check karke dobara try karein.";
  if (/auth\/(invalid-credential|wrong-password|user-not-found|invalid-login-credentials)/.test(code)) return "Password galat hai.";
  if (/auth\/too-many-requests/.test(code)) return "Bahut baar galat try hua. Thodi der baad try karein.";
  if (/auth\/network/.test(code)) return "Internet nahi hai.";
  return (e && e.message) || "Kuch gadbad ho gayi. Dobara try karein.";
}

/* =========================================================
   DATA WRITES (all limit-affecting writes are transactions)
   ========================================================= */
const totalRef = (month, qrId) => db.doc(`totals/${month}_${qrId}`);

// Pick the first QR (highest limit first) that can take this amount, put a
// hold on it and create a pending entry with the next remark number.
async function reservePayment({ role, qrs, margin, amount }) {
  const month = monthKey();
  const cands = activeQrs(qrs);
  if (!cands.length) throw new Error("NO_QR");
  return db.runTransaction(async (tx) => {
    const counterRef = db.doc(`counters/${month}_${role.id}`);
    const cSnap = await tx.get(counterRef);
    const tSnaps = [];
    for (const q of cands) tSnaps.push(await tx.get(totalRef(month, q.id)));
    const now = Date.now();
    let idx = -1;
    for (let i = 0; i < cands.length; i++) {
      const u = usageFor(tSnaps[i].data(), now);
      if (qrFits(u.used, Number(cands[i].limit), amount, margin)) { idx = i; break; }
    }
    if (idx < 0) throw new Error("NO_QR");
    const qr = cands[idx];
    const n = ((cSnap.exists && cSnap.data().n) || 0) + 1;
    const remark = `${role.remarkName} ${String(n).padStart(4, "0")}`;
    const entryRef = db.collection("entries").doc();
    const t = tSnaps[idx].data() || {};
    const holds = pruneHolds(t.holds, now);
    holds[entryRef.id] = { amount, at: now };
    tx.set(totalRef(month, qr.id), { month, qrId: qr.id, received: Number(t.received) || 0, holds });
    tx.set(counterRef, { n });
    const entry = {
      type: "payment", status: "pending",
      qrId: qr.id, qrName: qr.name, upiId: qr.upiId, payeeName: qr.payeeName || "",
      amount, reservedAmount: amount, remark, seq: n, month,
      branch: role.email, branchId: role.id, branchName: role.name,
      createdAt: FV.serverTimestamp(), createdAtMs: now, hasPhoto: false,
    };
    tx.set(entryRef, entry);
    return { id: entryRef.id, ...entry, createdAt: null };
  });
}

async function savePhoto(entry, dataUrl) {
  await db.doc(`photos/${entry.id}`).set({ branch: entry.branch, data: dataUrl, at: FV.serverTimestamp() });
}

async function markReceived(entry, { amount, photo }) {
  if (photo) await savePhoto(entry, photo);
  await db.runTransaction(async (tx) => {
    const eRef = db.doc(`entries/${entry.id}`);
    const tRef = totalRef(entry.month, entry.qrId);
    const eSnap = await tx.get(eRef);
    const tSnap = await tx.get(tRef);
    if (!eSnap.exists) throw new Error("NOT_FOUND");
    const e = eSnap.data();
    if (e.status !== "pending") throw new Error("ALREADY_DONE");
    const t = tSnap.data() || {};
    const holds = pruneHolds(t.holds, Date.now());
    delete holds[entry.id];
    tx.set(tRef, { month: entry.month, qrId: entry.qrId, received: (Number(t.received) || 0) + amount, holds });
    tx.update(eRef, { status: "received", amount, receivedAt: FV.serverTimestamp(), receivedAtMs: Date.now(), hasPhoto: !!(e.hasPhoto || photo) });
  });
}

async function cancelPayment(entry) {
  await db.runTransaction(async (tx) => {
    const eRef = db.doc(`entries/${entry.id}`);
    const tRef = totalRef(entry.month, entry.qrId);
    const eSnap = await tx.get(eRef);
    const tSnap = await tx.get(tRef);
    if (!eSnap.exists) throw new Error("NOT_FOUND");
    if (eSnap.data().status !== "pending") throw new Error("ALREADY_DONE");
    const t = tSnap.data() || {};
    const holds = pruneHolds(t.holds, Date.now());
    delete holds[entry.id];
    tx.set(tRef, { month: entry.month, qrId: entry.qrId, received: Number(t.received) || 0, holds });
    tx.update(eRef, { status: "cancelled", cancelledAtMs: Date.now() });
  });
}

// Edit amount / add photo / delete on a received entry or adjustment.
// Delete is soft (status "deleted") so history is never lost.
async function editEntry(entry, { amount, photo, note, del }, role) {
  if (photo) await savePhoto(entry, photo);
  await db.runTransaction(async (tx) => {
    const eRef = db.doc(`entries/${entry.id}`);
    const tRef = totalRef(entry.month, entry.qrId);
    const eSnap = await tx.get(eRef);
    const tSnap = await tx.get(tRef);
    if (!eSnap.exists) throw new Error("NOT_FOUND");
    const e = eSnap.data();
    if (e.status !== "received") throw new Error("ALREADY_DONE");
    const newAmount = del ? 0 : (amount ?? e.amount);
    const t = tSnap.data() || {};
    tx.set(tRef, { month: entry.month, qrId: entry.qrId, received: (Number(t.received) || 0) + newAmount - e.amount, holds: pruneHolds(t.holds, Date.now()) });
    const upd = { editedAtMs: Date.now(), editedBy: role.name, hasPhoto: !!(e.hasPhoto || photo) };
    if (del) { upd.status = "deleted"; upd.deletedAmount = e.amount; }
    else { upd.amount = newAmount; if (newAmount !== e.amount) upd.originalAmount = e.originalAmount ?? e.amount; }
    if (note !== undefined) upd.note = note;
    tx.update(eRef, upd);
  });
}

// Owner-only manual correction (+ or -) on a QR's month total.
async function addAdjustment({ month, qr, amount, note }) {
  await db.runTransaction(async (tx) => {
    const tRef = totalRef(month, qr.id);
    const tSnap = await tx.get(tRef);
    const t = tSnap.data() || {};
    const now = Date.now();
    tx.set(tRef, { month, qrId: qr.id, received: (Number(t.received) || 0) + amount, holds: pruneHolds(t.holds, now) });
    tx.set(db.collection("entries").doc(), {
      type: "adjustment", status: "received", qrId: qr.id, qrName: qr.name, upiId: qr.upiId,
      amount, remark: "Adjustment", note: note || "", month,
      branch: ADMIN_EMAIL, branchId: "admin", branchName: "Owner",
      createdAt: FV.serverTimestamp(), createdAtMs: now, hasPhoto: false,
    });
  });
}

// Safety net: rebuild every QR's month total from its received entries.
async function recalcTotals(month, qrs) {
  const snap = await db.collection("entries").where("month", "==", month).get();
  const sums = {};
  snap.forEach((d) => { const e = d.data(); if (e.status === "received") sums[e.qrId] = (sums[e.qrId] || 0) + (Number(e.amount) || 0); });
  const ids = new Set([...qrs.map((q) => q.id), ...Object.keys(sums)]);
  const batch = db.batch();
  ids.forEach((id) => batch.set(totalRef(month, id), { month, qrId: id, received: Math.round((sums[id] || 0) * 100) / 100 }, { merge: true }));
  await batch.commit();
}

function useSnapshot(makeRef, deps) {
  const [state, setState] = useState({ data: null, loading: true, error: null });
  useEffect(() => {
    const ref = makeRef();
    if (!ref) { setState({ data: null, loading: false, error: null }); return; }
    setState((s) => ({ ...s, loading: true }));
    return ref.onSnapshot(
      (snap) => {
        const data = snap.docs ? snap.docs.map((d) => ({ id: d.id, ...d.data() })) : (snap.exists ? { id: snap.id, ...snap.data() } : null);
        setState({ data, loading: false, error: null });
      },
      (err) => { console.error(err); setState({ data: null, loading: false, error: err }); }
    );
  }, deps);
  return state;
}
function useNow(everyMs = 30000) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), everyMs); return () => clearInterval(t); }, [everyMs]);
  return now;
}
function byQr(totals) { const m = {}; (totals || []).forEach((t) => { m[t.qrId] = t; }); return m; }

   RECEIVE FLOW
   ========================================================= */
function ReceiveTab({ role, settings, qrs, totals, now }) {
  const toast = useToast();
  const [amountStr, setAmountStr] = useState("");
  const [current, setCurrent] = useState(null);   // the pending entry being shown
  const [step, setStep] = useState("amount");     // amount | show | receive
  const [busy, setBusy] = useState(false);

  const pendingS = useSnapshot(() => role.isAdmin
    ? db.collection("entries").where("status", "==", "pending")
    : db.collection("entries").where("branch", "==", role.email).where("status", "==", "pending"), [role.email]);
  const pending = (pendingS.data || []).slice().sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));

  // Keep the shown entry in sync, and leave the screen if another phone finished it.
  useEffect(() => {
    if (!current || pendingS.loading || !pendingS.data) return;
    const live = pendingS.data.find((e) => e.id === current.id);
    if (!live && step !== "amount" && !busy) {
      const t = setTimeout(() => {
        db.doc(`entries/${current.id}`).get().then((s) => {
          if (s.exists && s.data().status !== "pending") { setCurrent(null); setStep("amount"); toast("Yeh payment kisi aur ne update kar di."); }
        }).catch(() => {});
      }, 1500);
      return () => clearTimeout(t);
    }
  }, [pendingS.data]);

  const active = activeQrs(qrs);

  async function generate() {
    const amount = parseAmount(amountStr);
    if (!(amount > 0)) { toast("Sahi amount daalein.", true); return; }
    setBusy(true);
    try {
      const entry = await reservePayment({ role, qrs, margin: Number(settings.margin) || 0, amount });
      setCurrent(entry);
      setStep("show");
      setAmountStr("");
    } catch (e) { toast(errMsg(e), true); }
    finally { setBusy(false); }
  }

  if (current && step === "show") {
    return <ShowQr entry={current} qrs={qrs} totals={totals} now={now} busy={busy}
      onReceived={() => setStep("receive")}
      onCancel={async () => {
        if (!confirm("Is payment ko cancel karein? Kuch bhi add nahi hoga.")) return;
        setBusy(true);
        try { await cancelPayment(current); toast("Payment cancel ho gayi."); setCurrent(null); setStep("amount"); }
        catch (e) { toast(errMsg(e), true); }
        finally { setBusy(false); }
      }}
      onBack={() => { setCurrent(null); setStep("amount"); }} />;
  }
  if (current && step === "receive") {
    const qr = (qrs || []).find((q) => q.id === current.qrId);
    const photoRequired = !!(settings.photoRequiredAll || (qr && qr.photoRequired));
    return <ReceiveForm entry={current} photoRequired={photoRequired}
      onBack={() => setStep("show")}
      onDone={() => { setCurrent(null); setStep("amount"); }} />;
  }

  return (
    <div className="page">
      <div className="card">
        <h3 style={{ fontSize: 17 }}>Kitna amount receive karna hai?</h3>
        <input className="input amount-input" inputMode="decimal" placeholder="₹ 0" value={amountStr} autoFocus
          onChange={(e) => setAmountStr(e.target.value.replace(/[^0-9.,]/g, ""))}
          onKeyDown={(e) => { if (e.key === "Enter") generate(); }} />
        {parseAmount(amountStr) > 0 && <div className="center muted small" style={{ marginTop: 6 }}>{rupees(parseAmount(amountStr))}</div>}
        <div style={{ height: 12 }} />
        <button className="btn block big" disabled={busy || !(parseAmount(amountStr) > 0)} onClick={generate}>
          {busy ? "QR dhundh rahe hain…" : "QR banao"}
        </button>
        {!active.length && <div className="alert red" style={{ marginTop: 12, marginBottom: 0 }}>Abhi koi active QR nahi hai. Owner ko QR add/enable karna hoga.</div>}
      </div>

      {pending.length > 0 && <>
        <div className="section-title">Open payments ({pending.length})</div>
        <div className="card" style={{ padding: "4px 16px" }}>
          {pending.map((e) => (
            <div className="list-item" key={e.id}>
              <div className="grow">
                <div className="row"><span className="remark-chip">{e.remark}</span><span className="amt">{rupees(e.amount)}</span></div>
                <div className="tiny muted" style={{ marginTop: 4 }}>{e.qrName} · {fmtDateTime(e.createdAtMs)}{role.isAdmin ? " · " + e.branchName : ""}</div>
                {now - (e.createdAtMs || 0) > HOLD_MS && <div className="tiny" style={{ color: "var(--warn)" }}>{HOLD_MINUTES} min se zyada purani: Received ya Cancel dabayein</div>}
              </div>
              <button className="btn sm soft" onClick={() => { setCurrent(e); setStep("show"); }}>Kholo</button>
            </div>
          ))}
        </div>
      </>}
    </div>
  );
}

            onChange={(e) => setAmountStr(e.target.value.replace(/[^0-9.,]/g, ""))} />
          <div className="hint">Customer ne alag amount bheja ho toh yahan sahi amount likhein.</div>
        </label>
        <PhotoPicker value={photo} onChange={setPhoto} required={photoRequired} />
        <button className="btn ok block big" disabled={busy || !(amount > 0) || (photoRequired && !photo)} onClick={save}>
          {busy ? "Save ho raha hai…" : "Save"}
        </button>
      </div>
    </div>
  );
}

/* =========================================================
   ENTRIES (branch: own, current month; admin: everything)
   ========================================================= */
function canEdit(e, role, now) {
  if (role.isAdmin) return true;
  return e.branch === role.email && now - (e.createdAtMs || 0) < EDIT_WINDOW_MS;
}

function EntryList({ entries, role, now, onEdit, onPhoto, showBranch }) {
  if (!entries.length) return <div className="muted center small" style={{ padding: 18 }}>Koi entry nahi.</div>;
  return entries.map((e) => {
    const editable = e.status === "received" && canEdit(e, role, now);
    const locked = e.status === "received" && !editable;
    return (
      <div className="list-item" key={e.id}>
        <div className="grow">
          <div className="row wrap" style={{ gap: 6 }}>
            <span className="remark-chip">{e.remark}</span>
            <StatusBadge e={e} />
            {locked && <span className="badge">🔒 Locked</span>}
          </div>
          <div className="tiny muted" style={{ marginTop: 4 }}>
            {e.qrName}{showBranch ? " · " + e.branchName : ""} · {fmtDateTime(e.createdAtMs)}
          </div>
          {e.originalAmount != null && e.status === "received" && <div className="tiny muted">Pehle {rupees(e.originalAmount)} tha · edit: {e.editedBy}</div>}
          {e.note && <div className="tiny muted">Note: {e.note}</div>}
        </div>
        <div className="right">
          <div className={"amt " + (e.status === "received" ? (e.amount < 0 ? "neg" : "") : "strike")}>{rupees(e.status === "deleted" ? e.deletedAmount : e.amount)}</div>
          <div className="row" style={{ gap: 6, justifyContent: "flex-end", marginTop: 4 }}>
            {e.hasPhoto && <button className="btn sm ghost" onClick={() => onPhoto(e)} aria-label="Photo">🖼️</button>}
            {editable && <button className="btn sm ghost" onClick={() => onEdit(e)}>Edit</button>}
          </div>
        </div>
      </div>
    );
  });
}

function EditEntryModal({ entry, role, onClose }) {
  const toast = useToast();
  const [amountStr, setAmountStr] = useState(String(entry.amount));
  const [note, setNote] = useState(entry.note || "");
  const [photo, setPhoto] = useState(null);
  const [busy, setBusy] = useState(false);
  const amount = parseAmount(amountStr);
  const allowNegative = entry.type === "adjustment";
  async function save(del) {
    if (!del && !(allowNegative ? amount !== 0 && isFinite(amount) : amount > 0)) { toast("Sahi amount daalein.", true); return; }
    if (del && !confirm("Yeh entry delete karein? Total se amount hat jaayega.")) return;
    setBusy(true);
    try {
      await editEntry(entry, { amount, photo, note: role.isAdmin ? note : undefined, del }, role);
      toast(del ? "Entry delete ho gayi." : "Entry update ho gayi.");
      onClose();
    } catch (e) { toast(errMsg(e), true); setBusy(false); }
  }
  return (
    <Modal title={`Edit · ${entry.remark}`} onClose={onClose}>
      {!role.isAdmin && <div className="alert info">Edit sirf {fmtDateTime((entry.createdAtMs || 0) + EDIT_WINDOW_MS)} tak ho sakta hai.</div>}
      <div className="small muted" style={{ marginBottom: 10 }}>{entry.qrName} · {entry.branchName} · {fmtDateTime(entry.createdAtMs)}</div>
      <label className="f"><span>Amount</span>
        <input className="input" inputMode="decimal" value={amountStr} onChange={(e) => setAmountStr(e.target.value.replace(allowNegative ? /[^0-9.,-]/g : /[^0-9.,]/g, ""))} />
      </label>
      {role.isAdmin && <label className="f"><span>Note</span><input className="input" value={note} onChange={(e) => setNote(e.target.value)} /></label>}
      {entry.type === "payment" && <PhotoPicker value={photo} onChange={setPhoto} required={false} />}
      {entry.hasPhoto && !photo && <div className="hint" style={{ marginTop: -6, marginBottom: 12 }}>Photo pehle se hai. Nayi lagayenge toh purani replace ho jaayegi.</div>}
      <div className="btn-row">
        <button className="btn bad" disabled={busy} onClick={() => save(true)}>Delete</button>
        <button className="btn" disabled={busy} onClick={() => save(false)}>{busy ? "…" : "Save"}</button>
      </div>
    </Modal>
  );
}

/* =========================================================
   ADMIN: DASHBOARD
   ========================================================= */
function Dashboard({ role, qrs, now }) {
  const toast = useToast();
  const [month, setMonth] = useState(monthKey(now));
  const [fBranch, setFBranch] = useState("");
  const [fQr, setFQr] = useState("");
  const [fStatus, setFStatus] = useState("received");
  const [editing, setEditing] = useState(null);
  const [photoOf, setPhotoOf] = useState(null);
  const [adjOpen, setAdjOpen] = useState(false);
  const [busy, setBusy] = useState(false);

  const totalsS = useSnapshot(() => db.collection("totals").where("month", "==", month), [month]);
  const entriesS = useSnapshot(() => db.collection("entries").where("month", "==", month), [month]);
  const tmap = byQr(totalsS.data);
  const all = (entriesS.data || []).slice().sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
  const today = dayKey(now);
  const isCurrent = month === monthKey(now);

  const qrList = (qrs || []).slice().sort((a, b) => {
    const aa = a.enabled && !isExpired(a, today), bb = b.enabled && !isExpired(b, today);
    return (bb - aa) || b.limit - a.limit || (a.createdAtMs || 0) - (b.createdAtMs || 0);
  });
  const received = all.filter((e) => e.status === "received");
  const grand = received.reduce((a, e) => a + e.amount, 0);
  const branchSums = {};
  received.forEach((e) => { branchSums[e.branchName] = (branchSums[e.branchName] || 0) + e.amount; });

  const filtered = all.filter((e) => (!fBranch || e.branch === fBranch) && (!fQr || e.qrId === fQr) && (!fStatus || e.status === fStatus));
  const branchOpts = [...BRANCHES.map((b) => ({ v: b.email, l: b.name })), { v: ADMIN_EMAIL, l: "Owner" }];

  async function recalc() {
    if (!confirm(`${monthLabel(month)} ke saare QR totals entries se dobara calculate karein?`)) return;
    setBusy(true);
    try { await recalcTotals(month, qrs || []); toast("Totals dobara calculate ho gaye."); }
    catch (e) { toast(errMsg(e), true); }
    finally { setBusy(false); }
  }

  return (
    <div className="page">
      <div className="row" style={{ marginBottom: 12 }}>
        <input type="month" className="input" style={{ maxWidth: 190 }} value={month} max={monthKey(now)}
          onChange={(e) => e.target.value && setMonth(e.target.value)} />
        <div className="grow" />
        <div className="right"><div className="tiny muted">Total received</div><div style={{ fontWeight: 700, fontSize: 18 }}>{rupees(grand)}</div></div>
      </div>

      <div className="section-title">QR status · {monthLabel(month)}</div>
      {!qrList.length && <div className="card muted small">Abhi koi QR nahi. "QRs" tab se add karein.</div>}
      {qrList.map((q) => {
        const u = usageFor(tmap[q.id], isCurrent ? now : 0);
        const off = !q.enabled, exp = isExpired(q, today);
        const lvl = levelFor(u.used, q.limit);
        return (
          <div className="card" key={q.id} style={{ padding: 14, opacity: off || exp ? 0.65 : 1 }}>
            <div className="row" style={{ marginBottom: 6 }}>
              <div className="grow">
                <div style={{ fontWeight: 600 }} className="ellipsis">{q.name}</div>
                <div className="tiny muted mono ellipsis">{q.upiId}</div>
              </div>
              {off ? <span className="badge">Disabled</span> : exp ? <span className="badge">Expired</span>
                : lvl === "red" ? <span className="badge bad">Limit full</span> : lvl === "yellow" ? <span className="badge warn">90%+</span> : <span className="badge ok">Active</span>}
            </div>
            <UsageBar used={u.used} limit={q.limit} />
            <div className="row tiny muted" style={{ marginTop: 5 }}>
              <span className="grow">{rupees(u.received)} received{u.held ? ` + ${rupees(u.held)} pending` : ""}</span>
              <span>{pct(u.used, q.limit)}% of {rupees(q.limit)}</span>
            </div>
          </div>
        );
      })}

      <div className="section-title">Branch-wise</div>
      <div className="stat-grid">
        {Object.keys(branchSums).length === 0 && <div className="muted small">Is mahine abhi kuch nahi.</div>}
        {Object.entries(branchSums).sort((a, b) => b[1] - a[1]).map(([b, v]) => (
          <div className="stat" key={b}><div className="v">{rupees(v)}</div><div className="l">{b}</div></div>
        ))}
      </div>

      <div className="section-title">Entries</div>
      <div className="chip-row">
        <select className="input" value={fStatus} onChange={(e) => setFStatus(e.target.value)}>
          <option value="received">Received</option><option value="pending">Pending</option>
          <option value="cancelled">Cancelled</option><option value="deleted">Deleted</option><option value="">Sab status</option>
        </select>
        <select className="input" value={fBranch} onChange={(e) => setFBranch(e.target.value)}>
          <option value="">Sab branch</option>{branchOpts.map((b) => <option key={b.v} value={b.v}>{b.l}</option>)}
        </select>
        <select className="input" value={fQr} onChange={(e) => setFQr(e.target.value)}>
          <option value="">Sab QR</option>{(qrs || []).map((q) => <option key={q.id} value={q.id}>{q.name}</option>)}
        </select>
      </div>
      <div className="card" style={{ padding: "4px 16px" }}>
        {entriesS.loading ? <div className="spinner" /> : entriesS.error ? <div className="alert red">{errMsg(entriesS.error)}</div>
          : <EntryList entries={filtered} role={role} now={now} onEdit={setEditing} onPhoto={setPhotoOf} showBranch />}
      </div>

      <div className="btn-row" style={{ marginTop: 6 }}>
        <button className="btn ghost" onClick={() => setAdjOpen(true)}>± Adjustment</button>
        <button className="btn ghost" disabled={busy} onClick={recalc}>↻ Recalculate</button>
      </div>
      <div className="hint">Adjustment: bank statement se milaan karke kisi QR ka total theek karne ke liye. Recalculate: saari entries se totals dobara banata hai.</div>

      {editing && <EditEntryModal entry={editing} role={role} onClose={() => setEditing(null)} />}
      {photoOf && <PhotoViewer entryId={photoOf.id} onClose={() => setPhotoOf(null)} />}
      {adjOpen && <AdjustmentModal month={month} qrs={qrs || []} onClose={() => setAdjOpen(false)} />}
    </div>
  );
}

function AdjustmentModal({ month, qrs, onClose }) {
  const toast = useToast();
  const [qrId, setQrId] = useState(qrs[0] ? qrs[0].id : "");
  const [amountStr, setAmountStr] = useState("");
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);
  const amount = parseAmount(amountStr);
  async function save() {
    const qr = qrs.find((q) => q.id === qrId);
    if (!qr) { toast("QR chunein.", true); return; }
    if (!amount || !isFinite(amount)) { toast("Amount daalein (minus ke liye -500 jaisa).", true); return; }
    setBusy(true);
    try { await addAdjustment({ month, qr, amount, note }); toast("Adjustment add ho gaya."); onClose(); }
    catch (e) { toast(errMsg(e), true); setBusy(false); }
  }
  return (
    <Modal title={`Adjustment · ${monthLabel(month)}`} onClose={onClose}>
      <label className="f"><span>QR</span>
        <select className="input" value={qrId} onChange={(e) => setQrId(e.target.value)}>
          {qrs.map((q) => <option key={q.id} value={q.id}>{q.name}</option>)}
        </select>
      </label>
      <label className="f"><span>Amount (+ ya −)</span>
        <input className="input" inputMode="text" placeholder="e.g. 2500 ya -2500" value={amountStr} onChange={(e) => setAmountStr(e.target.value.replace(/[^0-9.,-]/g, ""))} />
        <div className="hint">+ = total badhao (payment record nahi hui thi), − = total ghatao.</div>
      </label>
      <label className="f"><span>Note</span><input className="input" placeholder="Kyun?" value={note} onChange={(e) => setNote(e.target.value)} /></label>
      <button className="btn block" disabled={busy} onClick={save}>{busy ? "…" : "Save adjustment"}</button>
    </Modal>
  );
}

function QrForm({ qr, onClose }) {
  const toast = useToast();
  const isNew = !qr.id;
  const [name, setName] = useState(qr.name || "");
  const [upiId, setUpiId] = useState(qr.upiId || "");
  const [payeeName, setPayeeName] = useState(qr.payeeName || "");
  const [limitStr, setLimitStr] = useState(qr.limit ? String(qr.limit) : "");
  const [enabled, setEnabled] = useState(isNew ? true : !!qr.enabled);
  const [expiryEnabled, setExpiryEnabled] = useState(!!qr.expiryEnabled);
  const [expiryDate, setExpiryDate] = useState(qr.expiryDate || "");
  const [photoRequired, setPhotoRequired] = useState(!!qr.photoRequired);
  const [image, setImage] = useState(null);       // new compressed image
  const [existingImg, setExistingImg] = useState(null);
  const [scan, setScan] = useState(null);         // {ok, msg}
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);

  useEffect(() => {
    if (isNew) return;
    db.doc(`qrImages/${qr.id}`).get().then((s) => { if (s.exists) setExistingImg(s.data().data); }).catch(() => {});
  }, []);

  async function onFile(e) {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    setScan({ msg: "QR padh rahe hain…" });
    try {
      const text = await decodeQrFromFile(f);
      const upi = parseUpi(text);
      if (upi) {
        setUpiId(upi.pa);
        if (upi.pn) setPayeeName(upi.pn);
        if (!name) setName(upi.pn || upi.pa);
        setScan({ ok: true, msg: `UPI ID mil gayi: ${upi.pa}` });
      } else if (text) {
        setScan({ ok: false, msg: "QR mila par yeh UPI QR nahi lagta. UPI ID khud likhein." });
      } else {
        setScan({ ok: false, msg: "QR padha nahi gaya. Saaf/crop photo try karein, ya UPI ID khud likhein." });
      }
      setImage(await compressImage(f, { maxDim: 900, maxChars: 300000, quality: 0.85 }));
    } catch (err) { setScan({ ok: false, msg: errMsg(err) }); }
  }

  async function save() {
    const limit = parseAmount(limitStr);
    const pa = upiId.trim();
    if (!name.trim()) { toast("QR ka naam daalein.", true); return; }
    if (!/^[\w.\-]+@[\w.\-]+$/.test(pa)) { toast("UPI ID sahi nahi lag rahi (jaise name@okhdfc).", true); return; }
    if (!(limit > 0)) { toast("Monthly limit daalein.", true); return; }
    if (expiryEnabled && !expiryDate) { toast("Expiry date chunein.", true); return; }
    if (isNew && !image) { toast("QR photo upload karein.", true); return; }
    setBusy(true);
    try {
      const ref = isNew ? db.collection("qrs").doc() : db.doc(`qrs/${qr.id}`);
      if (image) await db.doc(`qrImages/${ref.id}`).set({ data: image });
      const data = {
        name: name.trim(), upiId: pa, payeeName: payeeName.trim(), limit, enabled,
        expiryEnabled, expiryDate: expiryEnabled ? expiryDate : "", photoRequired,
        hasImage: !!(image || existingImg || qr.hasImage),
      };
      if (isNew) { data.createdAt = FV.serverTimestamp(); data.createdAtMs = Date.now(); }
      await ref.set(data, { merge: true });
      toast(isNew ? "QR add ho gaya." : "QR update ho gaya.");
      onClose();
    } catch (e) { toast(errMsg(e), true); setBusy(false); }
  }

  const shownImg = image || existingImg;
  return (
    <Modal title={isNew ? "Naya QR" : "QR edit"} onClose={onClose}>
      <input ref={fileRef} type="file" accept="image/*" hidden onChange={onFile} />
      {shownImg && <img src={shownImg} className="photo-prev" style={{ marginBottom: 8 }} alt="QR" />}
      <button className="btn soft block" onClick={() => fileRef.current.click()}>{shownImg ? "QR photo badlo" : "📷 QR photo upload karo"}</button>
      {scan && <div className={"alert " + (scan.ok ? "info" : scan.ok === false ? "yellow" : "info")} style={{ marginTop: 8 }}>{scan.msg}</div>}
      <div style={{ height: 12 }} />
      <label className="f"><span>QR ka naam</span><input className="input" placeholder="e.g. Ramesh SBI" value={name} onChange={(e) => setName(e.target.value)} /></label>
      <label className="f"><span>UPI ID</span>
        <input className="input mono" autoCapitalize="none" autoCorrect="off" spellCheck={false} placeholder="name@okhdfcbank" value={upiId} onChange={(e) => setUpiId(e.target.value.replace(/\s/g, ""))} />
        <div className="hint">Photo se apne aap aati hai. Ek baar check zaroor karein.</div>
      </label>
      <label className="f"><span>Account holder ka naam (UPI mein dikhega)</span><input className="input" value={payeeName} onChange={(e) => setPayeeName(e.target.value)} /></label>
      <label className="f"><span>Monthly limit (₹)</span><input className="input" inputMode="numeric" placeholder="100000" value={limitStr} onChange={(e) => setLimitStr(e.target.value.replace(/[^0-9.,]/g, ""))} />
        {parseAmount(limitStr) > 0 && <div className="hint">{rupees(parseAmount(limitStr))}</div>}
      </label>
      <Toggle label="Enabled" sub="Off karne par yeh QR kabhi nahi dikhega" checked={enabled} onChange={setEnabled} />
      <Toggle label="Expiry set karo" sub="Off = permanent" checked={expiryEnabled} onChange={setExpiryEnabled} />
      {expiryEnabled && <label className="f" style={{ marginTop: 8 }}><span>Last date (is din tak chalega)</span>
        <input type="date" className="input" value={expiryDate} onChange={(e) => setExpiryDate(e.target.value)} /></label>}
      <Toggle label="Reference photo zaroori" sub="Is QR ki har payment pe photo leni padegi" checked={photoRequired} onChange={setPhotoRequired} />
      <div style={{ height: 14 }} />
      <button className="btn block big" disabled={busy} onClick={save}>{busy ? "Save ho raha hai…" : "Save"}</button>
    </Modal>
  );
}

function SettingsTab({ settings, role }) {

  const [marginStr, setMarginStr] = useState(String(settings.margin));
  const [busy, setBusy] = useState(false);
  useEffect(() => { setMarginStr(String(settings.margin)); }, [settings.margin]);
  async function saveMargin() {
    const m = parseAmount(marginStr);
    if (!(m >= 0)) { toast("Sahi margin daalein.", true); return; }
    setBusy(true);
    try { await db.doc("settings/global").set({ margin: m }, { merge: true }); toast("Margin save ho gaya."); }
    catch (e) { toast(errMsg(e), true); } finally { setBusy(false); }
  }
  async function setPhotoAll(v) {
    try { await db.doc("settings/global").set({ photoRequiredAll: v }, { merge: true }); }
    catch (e) { toast(errMsg(e), true); }
  }
  return (
    <div className="page">
      <div className="card">
        <h3>Over-limit margin</h3>
        <div className="small muted" style={{ marginBottom: 10 }}>
          Jab tak QR 100% se neeche hai, ek aakhri payment limit ke upar ja sakti hai, bas total limit + margin se zyada na ho.
          Example: limit 1,00,000, received 95,000, margin 10,000 → 15,000 tak ki payment isi QR pe chalegi.
        </div>
        <div className="row">
          <input className="input grow" inputMode="numeric" value={marginStr} onChange={(e) => setMarginStr(e.target.value.replace(/[^0-9.,]/g, ""))} />
          <button className="btn" disabled={busy} onClick={saveMargin}>Save</button>
        </div>
      </div>
      <div className="card">
        <Toggle label="Sab QR pe reference photo zaroori" sub="On = har payment pe photo leni padegi. Off = sirf un QR pe jinpe alag se on hai." checked={settings.photoRequiredAll} onChange={setPhotoAll} />
      </div>
      <div className="card small muted">
        <div>Logged in: <b>{role.email}</b></div>
        <div style={{ marginTop: 4 }}>Pending payment {HOLD_MINUTES} min tak QR limit mein reserve rehti hai. Branch entry {EDIT_WINDOW_HOURS} ghante baad lock.</div>
      </div>
    </div>
  );
}

/* =========================================================
   SHELL
   ========================================================= */
function Main({ role }) {
  const now = useNow();
  const month = monthKey(now);
  const [tab, setTab] = useState("receive");
  const settingsS = useSnapshot(() => db.doc("settings/global"), []);
  const qrsS = useSnapshot(() => db.collection("qrs"), []);
  const totalsS = useSnapshot(() => db.collection("totals").where("month", "==", month), [month]);
  const settings = { ...DEFAULT_SETTINGS, ...(settingsS.data || {}) };
  const qrs = qrsS.data || [];

  const tabs = role.isAdmin
    ? [["receive", "💳", "Receive"], ["dash", "📊", "Dashboard"], ["qrs", "🔳", "QRs"], ["settings", "⚙️", "Settings"]]
    : [["receive", "💳", "Receive"], ["mine", "📒", "Entries"]];

  let body;
  if (qrsS.loading || settingsS.loading) body = <div className="spinner" />;
  else if (qrsS.error) body = <div className="page"><div className="alert red">{errMsg(qrsS.error)}</div></div>;
  else if (tab === "receive") body = <ReceiveTab role={role} settings={settings} qrs={qrs} totals={totalsS.data} now={now} />;
  else if (tab === "mine") body = <MyEntriesTab role={role} now={now} />;
  else if (tab === "dash") body = <Dashboard role={role} qrs={qrs} now={now} />;
  else if (tab === "qrs") body = <QrsTab qrs={qrs} settings={settings} now={now} />;
  else if (tab === "settings") body = <SettingsTab settings={settings} role={role} />;

  return (
    <div className="app">
      <div className="top">
        <div>
          <div className="title">QR Tracker</div>
          <div className="sub">{role.name} · {monthLabel(month)}</div>
        </div>
        <div className="spacer" />
        <button className="logout" onClick={() => { if (confirm("Logout karein?")) auth.signOut(); }}>Logout</button>
      </div>
      {body}
      <nav className="tabs"><div className="tabs-inner">
        {tabs.map(([k, ic, l]) => (
          <button key={k} className={"tab" + (tab === k ? " on" : "")} onClick={() => { setTab(k); window.scrollTo(0, 0); }}>
            <span className="ic">{ic}</span>{l}
          </button>
        ))}
      </div></nav>
    </div>
  );
}

function Login() {
  const toast = useToast();
  const [who, setWho] = useState(BRANCHES[0] ? BRANCHES[0].id : "admin");
  const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false);
  async function submit(e) {
    e.preventDefault();
    const email = who === "admin" ? ADMIN_EMAIL : BRANCHES.find((b) => b.id === who).email;
    setBusy(true);
    try { await auth.signInWithEmailAndPassword(email, pw); }
    catch (err) { toast(errMsg(err), true); setBusy(false); }
  }
  return (
    <div className="login-wrap">
      <form className="card login-card" onSubmit={submit}>
        <img src="icons/icon-192.png" className="logo" alt="" />
        <h2 className="center" style={{ margin: "0 0 16px" }}>QR Tracker</h2>
        <label className="f"><span>Login</span>
          <select className="input" value={who} onChange={(e) => setWho(e.target.value)}>
            {BRANCHES.map((b) => <option key={b.id} value={b.id}>{b.name} branch</option>)}
            <option value="admin">Owner (Admin)</option>
          </select>
        </label>
        <label className="f"><span>Password</span>
          <input className="input" type="password" autoComplete="current-password" value={pw} onChange={(e) => setPw(e.target.value)} />
        </label>
        <button className="btn block big" disabled={busy || !pw}>{busy ? "…" : "Login"}</button>
      </form>
    </div>
  );
}

function SetupNeeded() {
  return (
    <div className="login-wrap">
      <div className="card login-card">
        <h2 style={{ marginTop: 0 }}>Setup baaki hai</h2>
        <p className="small muted">Firebase config abhi <code className="inline">index.html</code> mein paste nahi hua. Repo mein <code className="inline">SETUP.md</code> ke steps follow karein.</p>
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(undefined);
  const [toast, setToast] = useState(null);
  const showToast = useCallback((msg, isError) => {
    setToast({ msg, isError, id: Date.now() });
  }, []);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), toast.isError ? 4500 : 2600);
    return () => clearTimeout(t);
  }, [toast]);
  useEffect(() => (auth ? auth.onAuthStateChanged((u) => setUser(u || null)) : undefined), []);

  let body;
  if (CONFIG_MISSING) body = <SetupNeeded />;
  else if (user === undefined) body = <div className="spinner" style={{ marginTop: "40vh" }} />;
  else if (!user) body = <Login />;
  else {
    const role = roleFor(user);
    body = role.unknown
      ? <div className="login-wrap"><div className="card login-card"><p>{role.email} is app ka login nahi hai.</p><button className="btn block" onClick={() => auth.signOut()}>Logout</button></div></div>
      : <Main role={role} key={role.email} />;
  }
  return (
    <ToastCtx.Provider value={showToast}>
      {body}
      {toast && <div className={"toast" + (toast.isError ? " error" : "")} key={toast.id}>{toast.msg}</div>}
    </ToastCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (err) { console.warn("SW register failed", err); });
    });
  }
</script>
</body>
